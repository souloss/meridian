version: "2"

sql:
  - engine: postgresql
    schema: migrations
    queries: migrations/queries
    gen:
      go:
        package: repository
        out: internal/generated/repository
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: uuid
              type: UUID
              pointer: true
