        override: {$ref: '#/components/schemas/ViewOverrideValue', description: "contains the view override value associated with this view override."}
        updatedAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was last updated."}
    ViewOverridePutRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      allOf:
        - {$ref: '#/components/schemas/ViewOverrideValue'}
    ViewOverrideList:
      description: "contains an ordered collection of view override values."
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ViewOverride'}, description: "contains the ordered items associated with this view override list."}}
    NotificationChannelKind:
      description: "identifies one supported notification channel kind value."
      type: string
      enum: [in_app, webhook, email]
    NotificationChannel:
      description: "represents notification channel data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, etag, name, kind, enabled, endpoint, secretConfigured, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        etag: {$ref: '#/components/schemas/ETag', description: "is the opaque entity tag required for optimistic concurrency control."}
        name: {type: string, description: "specifies the name associated with this notification channel."}
        kind: {$ref: '#/components/schemas/NotificationChannelKind', description: "contains the notification channel kind associated with this notification channel."}
        enabled: {type: boolean, description: "indicates whether enabled applies to this notification channel."}
        endpoint: {type: [string, 'null'], description: "specifies the endpoint associated with this notification channel."}
        secretConfigured: {type: boolean, description: "indicates whether secret configured applies to this notification channel."}
        createdAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was created."}
        updatedAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was last updated."}
    NotificationChannelCreateRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [name, kind, enabled]
      allOf:
        - if: {properties: {kind: {const: in_app}}, required: [kind]}
          then: {not: {anyOf: [{required: [endpoint]}, {required: [secret]}]}}
        - if: {properties: {kind: {const: webhook}}, required: [kind]}
          then:
            required: [endpoint, secret]
            properties:
              endpoint: {type: string, format: uri, maxLength: 2048}
              secret: {type: string, minLength: 32, maxLength: 4096, writeOnly: true}
        - if: {properties: {kind: {const: email}}, required: [kind]}
          then:
            required: [endpoint]
            not: {required: [secret]}
            properties: {endpoint: {type: string, format: email, maxLength: 320}}
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: "specifies the name associated with this notification channel create request."}
        kind: {$ref: '#/components/schemas/NotificationChannelKind', description: "contains the notification channel kind associated with this notification channel create request."}
        enabled: {type: boolean, description: "indicates whether enabled applies to this notification channel create request."}
        endpoint: {type: [string, 'null'], maxLength: 2048, description: "specifies the endpoint associated with this notification channel create request."}
        secret: {type: [string, 'null'], minLength: 32, maxLength: 4096, writeOnly: true, description: "is write-only secret material and must never be returned by the API."}
    NotificationChannelPatchRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: "specifies the name associated with this notification channel patch request."}
        enabled: {type: boolean, description: "indicates whether enabled applies to this notification channel patch request."}
        endpoint: {type: [string, 'null'], maxLength: 2048, description: "specifies the endpoint associated with this notification channel patch request."}
    NotificationChannelRotateRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: {type: string, minLength: 32, maxLength: 4096, writeOnly: true, description: "is write-only secret material and must never be returned by the API."}
    NotificationChannelList:
      description: "contains an ordered collection of notification channel values."
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/NotificationChannel'}, description: "contains the ordered items associated with this notification channel list."}}
    ServiceRef:
      description: "represents service ref data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, slug, displayName]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        slug: {$ref: '#/components/schemas/Slug', description: "contains the slug associated with this service ref."}
        displayName: {type: string, description: "specifies the display name associated with this service ref."}
    OwnerRefs:
      description: "represents owner refs data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [userIds, teamIds]
      properties:
        userIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered user ids associated with this owner refs."}
        teamIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered team ids associated with this owner refs."}
    FieldSource:
      description: "represents field source data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [pointer, source]
      properties:
        pointer: {type: string, description: "specifies the pointer associated with this field source."}
        source: {$ref: '#/components/schemas/ConfigSource', description: "contains the config source associated with this field source."}
    DriftInfo:
      description: "represents drift info data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [hasDrift, fields, fileCommit]
      properties:
        hasDrift: {type: boolean, description: "indicates whether drift applies to this drift info."}
        fields: {type: array, items: {$ref: '#/components/schemas/FieldSource'}, description: "contains the ordered fields associated with this drift info."}
        fileCommit: {type: [string, 'null'], description: "specifies the file commit associated with this drift info."}
    RepositoryRef:
      description: "represents repository ref data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, defaultBranch]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        defaultBranch: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this repository ref."}
    AssetSummary:
      description: "represents asset summary data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, kind, name, lifecycle, health, currentVersion, latestVersion, refType, ref]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this asset summary."}
        name: {$ref: '#/components/schemas/AssetName', description: "contains the asset name associated with this asset summary."}
        lifecycle:
          allOf: [{$ref: '#/components/schemas/Lifecycle'}]
          description: "of currentVersion, otherwise latestVersion, otherwise draft for the repository default Track."
        health: {type: string, enum: [ok, stale, invalid], description: "specifies the health associated with this asset summary."}
        currentVersion: {oneOf: [{$ref: '#/components/schemas/VersionRef'}, {type: 'null'}], description: "specifies the current version associated with this asset summary."}
        latestVersion: {oneOf: [{$ref: '#/components/schemas/VersionRef'}, {type: 'null'}], description: "specifies the latest version associated with this asset summary."}
        refType: {$ref: '#/components/schemas/RefType', description: "contains the ref type associated with this asset summary."}
        ref: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this asset summary."}
    MissingKind:
      description: "represents missing kind data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [kind, canConfigure, canGenerateWithAi]
      properties:
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this missing kind."}
        canConfigure: {type: boolean, description: "indicates whether configure applies to this missing kind."}
        canGenerateWithAi: {type: boolean, description: "indicates whether generate with ai applies to this missing kind."}
    Service:
      description: "represents service data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, etag, slug, displayName, description, rootDir, language, framework, visibility, lifecycle, repository, owners, tags, assets, missingKinds, drift, capabilities, starred, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        etag: {$ref: '#/components/schemas/ETag', description: "is the opaque entity tag required for optimistic concurrency control."}
        slug: {$ref: '#/components/schemas/Slug', description: "contains the slug associated with this service."}
        displayName: {type: string, description: "specifies the display name associated with this service."}
