      allOf:
        - if: {properties: {deleted: {const: true}}, required: [deleted]}
          then: {properties: {afterCommit: {type: 'null'}}}
          else: {properties: {afterCommit: {type: string, pattern: '^[0-9a-f]{40,64}$'}}}
      properties:
        refType: {$ref: '#/components/schemas/RefType', description: "contains the ref type associated with this git push webhook."}
        ref: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this git push webhook."}
        beforeCommit: {type: [string, 'null'], pattern: '^[0-9a-f]{40,64}$', description: "specifies the before commit associated with this git push webhook."}
        afterCommit: {type: [string, 'null'], pattern: '^[0-9a-f]{40,64}$', description: "specifies the after commit associated with this git push webhook."}
        deleted: {type: boolean, description: "indicates whether deleted applies to this git push webhook."}
      description: afterCommit is null exactly when deleted is true; beforeCommit may be null for a new ref.
    BranchPolicy:
      description: "represents branch policy data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [branchPatterns, tagPatterns]
      properties:
        branchPatterns: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RefGlob'}, description: "contains the ordered branch patterns associated with this branch policy."}
        tagPatterns: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/RefGlob'}, description: "contains the ordered tag patterns associated with this branch policy."}
    FetchConfig:
      description: "represents fetch config data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [shallow, submodules, pathAllow, pathIgnore, knownHostPolicy]
      properties:
        shallow: {type: boolean, default: true, description: "indicates whether shallow applies to this fetch config."}
        depth: {type: [integer, 'null'], minimum: 1, maximum: 10000, default: 50, description: "specifies the depth associated with this fetch config."}
        submodules: {type: boolean, default: false, description: "indicates whether submodules applies to this fetch config."}
        proxy: {type: [string, 'null'], maxLength: 2048, description: "specifies the proxy associated with this fetch config."}
        pathAllow: {type: array, uniqueItems: true, items: {type: string, maxLength: 512, format: repository-relative-glob}, description: "contains the ordered path allow associated with this fetch config."}
        pathIgnore: {type: array, uniqueItems: true, items: {type: string, maxLength: 512, format: gitignore-pattern}, description: "contains the ordered path ignore associated with this fetch config."}
        knownHostPolicy: {type: string, enum: [strict, accept_new], default: strict, description: "specifies the known host policy associated with this fetch config."}
    RepositoryError:
      description: "represents repository error data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [class, message]
      properties:
        class: {type: string, enum: [dns, auth, host_key, timeout, invalid_config, other], description: "specifies the class associated with this repository error."}
        message: {type: string, description: "specifies the message associated with this repository error."}
    RepositoryHealth:
      description: "represents repository health data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [lastSyncAt, lastCommit, lastError, failStreak, durationMs]
      properties:
        lastSyncAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}], description: "specifies the last sync at associated with this repository health."}
        lastCommit: {type: [string, 'null'], description: "specifies the last commit associated with this repository health."}
        lastError: {oneOf: [{$ref: '#/components/schemas/RepositoryError'}, {type: 'null'}], description: "specifies the last error associated with this repository health."}
        failStreak: {type: integer, minimum: 0, description: "specifies the fail streak associated with this repository health."}
        durationMs: {type: [integer, 'null'], minimum: 0, description: "specifies the duration ms associated with this repository health."}
    Repository:
      description: "represents repository data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, etag, url, credentialId, defaultBranch, branchPolicy, fetchConfig, syncCron, note, health, capabilities, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        etag: {$ref: '#/components/schemas/ETag', description: "is the opaque entity tag required for optimistic concurrency control."}
        url: {$ref: '#/components/schemas/GitRemoteUrl', description: "contains the git remote url associated with this repository."}
        credentialId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Tenant-visible credential ID; may identify a tenant credential or a global credential. Null means public access.
        defaultBranch: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this repository."}
        branchPolicy: {$ref: '#/components/schemas/BranchPolicy', description: "contains the branch policy associated with this repository."}
        fetchConfig: {$ref: '#/components/schemas/FetchConfig', description: "contains the fetch config associated with this repository."}
        syncCron: {type: [string, 'null'], maxLength: 128, format: cron-5-field, description: Standard five-field cron in UTC; null disables schedule}
        note: {type: [string, 'null'], maxLength: 500, description: "specifies the note associated with this repository."}
        health: {$ref: '#/components/schemas/RepositoryHealth', description: "contains the repository health associated with this repository."}
        capabilities: {$ref: '#/components/schemas/CapabilityList', description: "lists actions the authenticated principal may perform on this resource."}
        createdAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was created."}
        updatedAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was last updated."}
    RepositoryCreateRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [url, defaultBranch]
      properties:
        url: {$ref: '#/components/schemas/GitRemoteUrl', description: "contains the git remote url associated with this repository create request."}
        credentialId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Tenant-visible credential ID; may identify a tenant credential or a global credential. Null means public access.
        defaultBranch: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this repository create request."}
        branchPolicy: {$ref: '#/components/schemas/BranchPolicy', description: "contains the branch policy associated with this repository create request."}
        fetchConfig: {$ref: '#/components/schemas/FetchConfig', description: "contains the fetch config associated with this repository create request."}
        syncCron: {type: [string, 'null'], maxLength: 128, format: cron-5-field, description: Standard five-field cron in UTC; null disables schedule}
        note: {type: [string, 'null'], maxLength: 500, description: "specifies the note associated with this repository create request."}
    RepositoryPatchRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        credentialId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Tenant-visible credential ID; may identify a tenant credential or a global credential. Null means public access.
        defaultBranch: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this repository patch request."}
        branchPolicy: {$ref: '#/components/schemas/BranchPolicy', description: "contains the branch policy associated with this repository patch request."}
        fetchConfig: {$ref: '#/components/schemas/FetchConfig', description: "contains the fetch config associated with this repository patch request."}
        syncCron: {type: [string, 'null'], maxLength: 128, format: cron-5-field, description: Standard five-field cron in UTC; null disables schedule}
        note: {type: [string, 'null'], maxLength: 500, description: "specifies the note associated with this repository patch request."}
    RepositorySyncRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      properties:
        refType: {$ref: '#/components/schemas/RefType', description: "contains the ref type associated with this repository sync request."}
        ref: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this repository sync request."}
        force: {type: boolean, default: false, description: "indicates whether force applies to this repository sync request."}
    RepositoryDiscoverRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      properties:
        refType: {$ref: '#/components/schemas/RefType', description: "contains the ref type associated with this repository discover request."}
        ref: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this repository discover request."}
        pathPrefixes: {type: array, uniqueItems: true, items: {type: string, maxLength: 512}, description: "contains the ordered path prefixes associated with this repository discover request."}
    RepositoryPage:
      description: "contains one paginated page of repository records."
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Repository'}, description: "contains the ordered items associated with this repository page."}}}
    DiscoveryCandidate:
      description: "represents discovery candidate data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, path, suggestedSlug, displayName, confidence, detectedKinds, status, discoveredAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        path: {type: string, description: "specifies the path associated with this discovery candidate."}
        suggestedSlug: {$ref: '#/components/schemas/Slug', description: "contains the slug associated with this discovery candidate."}
        displayName: {type: string, description: "specifies the display name associated with this discovery candidate."}
        confidence: {type: number, minimum: 0, maximum: 1, description: "specifies the confidence associated with this discovery candidate."}
        detectedKinds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/KindId'}, description: "contains the ordered detected kinds associated with this discovery candidate."}
        status: {type: string, enum: [pending, accepted, dismissed], description: "is the current lifecycle or processing state."}
        discoveredAt: {$ref: '#/components/schemas/Timestamp', description: "contains the timestamp associated with this discovery candidate."}
    CandidatePage:
      description: "contains one paginated page of candidate records."
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/DiscoveryCandidate'}, description: "contains the ordered items associated with this candidate page."}}}
    CandidateOverride:
      description: "represents candidate override data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: {$ref: '#/components/schemas/Uuid', description: "contains the uuid associated with this candidate override."}
        slug: {$ref: '#/components/schemas/Slug', description: "contains the slug associated with this candidate override."}
        displayName: {type: string, minLength: 1, maxLength: 128, description: "specifies the display name associated with this candidate override."}
        visibility: {$ref: '#/components/schemas/ServiceVisibility', description: "contains the service visibility associated with this candidate override."}
    CandidatesAcceptRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [candidateIds]
      properties:
        candidateIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "indicates whether candidate ids applies to this candidates accept request."}
        overrides: {type: array, items: {$ref: '#/components/schemas/CandidateOverride'}, description: "contains the ordered overrides associated with this candidates accept request."}
    ConfigImportPreviewRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      properties:
        refType: {$ref: '#/components/schemas/RefType', description: "contains the ref type associated with this config import preview request."}
        ref: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this config import preview request."}
    ConfigFieldDiff:
      description: "represents config field diff data exchanged through the Meridian API."
      type: object
