      properties:
        etag: {$ref: '#/components/schemas/ETag'}
        locale: {type: string, enum: [zh-CN, en]}
        theme: {type: string, enum: [light, dark, system]}
        defaultViews: {type: object, additionalProperties: {type: string}}
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 128}
        email: {type: [string, 'null'], format: email}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    UserPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 128}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    UserPreferencesPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale: {type: string, enum: [zh-CN, en]}
        theme: {type: string, enum: [light, dark, system]}
        defaultViews: {type: object, additionalProperties: {type: string}}
    UserPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}}}
    Quota:
      type: object
      additionalProperties: false
      required: [maxRepositories, maxServices, maxStorageBytes, maxCollectConcurrency]
      properties:
        maxRepositories: {type: integer, minimum: 0}
        maxServices: {type: integer, minimum: 0}
        maxStorageBytes: {type: integer, minimum: 0}
        maxCollectConcurrency: {type: integer, minimum: 1}
    Tenant:
      type: object
      additionalProperties: false
      required: [id, etag, slug, displayName, status, quota, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        etag: {$ref: '#/components/schemas/ETag'}
        slug: {$ref: '#/components/schemas/Slug'}
        displayName: {type: string, minLength: 1, maxLength: 128}
        status: {$ref: '#/components/schemas/TenantStatus'}
        quota: {$ref: '#/components/schemas/Quota'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    TenantCreateRequest:
      type: object
      additionalProperties: false
