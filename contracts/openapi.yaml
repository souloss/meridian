      schema:
        type: string
        minLength: 32
        maxLength: 512
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      description: identifies or filters the snapshot id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    Sort:
      name: sort
      in: query
      required: false
      description: identifies or filters the sort value in the query.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SourceId:
      name: sourceId
      in: path
      required: true
      description: identifies or filters the source id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    TagId:
      name: tagId
      in: path
      required: true
