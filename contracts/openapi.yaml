      properties:
        type: {type: string, const: version, description: "specifies the type associated with this version selector."}
        versionId: {$ref: '#/components/schemas/Uuid', description: "identifies the asset version associated with this resource."}
    RefSelector:
      description: "identifies the ref selected by a request."
      type: object
      additionalProperties: false
      required: [type, assetId, refType, ref]
      properties:
        type: {type: string, const: ref, description: "specifies the type associated with this ref selector."}
        assetId: {$ref: '#/components/schemas/Uuid', description: "identifies the asset associated with this resource."}
        refType: {$ref: '#/components/schemas/RefType', description: "contains the ref type associated with this ref selector."}
        ref: {$ref: '#/components/schemas/RefName', description: "contains the ref name associated with this ref selector."}
    UploadSelector:
      description: "identifies the upload selected by a request."
      type: object
      additionalProperties: false
      required: [type, uploadId]
      properties:
        type: {type: string, const: upload, description: "specifies the type associated with this upload selector."}
        uploadId: {$ref: '#/components/schemas/Uuid', description: "contains the uuid associated with this upload selector."}
    DocumentSelector:
      description: "identifies the document selected by a request."
      oneOf:
        - {$ref: '#/components/schemas/VersionSelector'}
        - {$ref: '#/components/schemas/RefSelector'}
        - {$ref: '#/components/schemas/UploadSelector'}
      discriminator: {propertyName: type}
    DiffCreateRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left: {$ref: '#/components/schemas/DocumentSelector', description: "contains the document selector associated with this diff create request."}
        right: {$ref: '#/components/schemas/DocumentSelector', description: "contains the document selector associated with this diff create request."}
        ruleSetId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: "specifies the rule set id associated with this diff create request."}
        persist: {type: boolean, default: true, description: "indicates whether persist applies to this diff create request."}
    DiffChange:
      description: "represents diff change data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, level, code, path, summary, before, after]
      properties:
        id: {type: string, description: "uniquely identifies this resource."}
        level: {$ref: '#/components/schemas/DiffLevel', description: "contains the diff level associated with this diff change."}
        code: {type: string, description: "specifies the code associated with this diff change."}
        path: {type: string, description: "specifies the path associated with this diff change."}
        summary: {type: string, description: "specifies the summary associated with this diff change."}
        before: {description: "specifies the before associated with this diff change."}
        after: {description: "specifies the after associated with this diff change."}
    DiffResult:
      description: "reports the result of the corresponding Meridian operation."
      type: object
      additionalProperties: false
      required: [kind, left, right, snapshotId, summary, changes, generatedAt]
      properties:
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this diff result."}
        left: {$ref: '#/components/schemas/ResolvedDocumentRef', description: "contains the resolved document ref associated with this diff result."}
        right: {$ref: '#/components/schemas/ResolvedDocumentRef', description: "contains the resolved document ref associated with this diff result."}
        snapshotId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Non-null exactly when DiffCreateRequest.persist is true.
        summary: {$ref: '#/components/schemas/DiffCounts', description: "contains the diff counts associated with this diff result."}
        changes: {type: array, items: {$ref: '#/components/schemas/DiffChange'}, description: "contains the ordered changes associated with this diff result."}
        generatedAt: {$ref: '#/components/schemas/Timestamp', description: "contains the timestamp associated with this diff result."}
    ResolvedDocumentRef:
      type: object
      additionalProperties: false
      required: [sourceType, kind, contentHash, assetId, versionId, uploadId, requestedRefType, requestedRef]
      properties:
        sourceType: {type: string, enum: [version, upload], description: "specifies the source type associated with this resolved document ref."}
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this resolved document ref."}
        contentHash: {type: string, description: "specifies the content hash associated with this resolved document ref."}
        assetId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: "identifies the asset associated with this resource."}
        versionId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: "identifies the asset version associated with this resource."}
        uploadId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: "specifies the upload id associated with this resolved document ref."}
        requestedRefType: {oneOf: [{$ref: '#/components/schemas/RefType'}, {type: 'null'}], description: "specifies the requested ref type associated with this resolved document ref."}
        requestedRef: {oneOf: [{$ref: '#/components/schemas/RefName'}, {type: 'null'}], description: "specifies the requested ref associated with this resolved document ref."}
      description: >-
        Immutable resolution. version requires assetId/versionId and upload requires uploadId;
        requestedRef fields are informational and never re-resolved.
    DiffSnapshot:
      description: "represents diff snapshot data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, result, createdBy, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        result: {$ref: '#/components/schemas/DiffResult', description: "contains the diff result associated with this diff snapshot."}
        createdBy: {$ref: '#/components/schemas/Uuid', description: "contains the uuid associated with this diff snapshot."}
        createdAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was created."}
    DiffSnapshotPage:
      description: "contains one paginated page of diff snapshot records."
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/DiffSnapshot'}, description: "contains the ordered items associated with this diff snapshot page."}}}
    DiffSnapshotShareRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: {type: integer, minimum: 300, maximum: 2592000, description: "specifies the expires in seconds associated with this diff snapshot share request."}
    ArtifactLink:
      description: "represents artifact link data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: {type: string, format: uri-reference, description: "specifies the url associated with this artifact link."}
        expiresAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant after which this value is invalid."}
    DiffRule:
      description: "represents diff rule data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [code, level, enabled]
      properties:
        code: {type: string, description: "specifies the code associated with this diff rule."}
        level: {$ref: '#/components/schemas/DiffLevel', description: "contains the diff level associated with this diff rule."}
        enabled: {type: boolean, description: "indicates whether enabled applies to this diff rule."}
    DiffRuleSet:
      description: "represents diff rule set data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, etag, name, kind, version, rules, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        etag: {$ref: '#/components/schemas/ETag', description: "is the opaque entity tag required for optimistic concurrency control."}
        name: {type: string, description: "specifies the name associated with this diff rule set."}
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this diff rule set."}
        version: {type: integer, minimum: 1, description: "specifies the version associated with this diff rule set."}
        rules: {type: array, items: {$ref: '#/components/schemas/DiffRule'}, description: "contains the ordered rules associated with this diff rule set."}
        createdAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was created."}
        updatedAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was last updated."}
    DiffRuleSetCreateRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [name, kind, rules]
      properties:
        name: {type: string, minLength: 1, maxLength: 128, description: "specifies the name associated with this diff rule set create request."}
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this diff rule set create request."}
        rules: {type: array, items: {$ref: '#/components/schemas/DiffRule'}, description: "contains the ordered rules associated with this diff rule set create request."}
    DiffRuleSetPatchRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128, description: "specifies the name associated with this diff rule set patch request."}
        rules: {type: array, items: {$ref: '#/components/schemas/DiffRule'}, description: "contains the ordered rules associated with this diff rule set patch request."}
    DiffRuleSetList:
      description: "contains an ordered collection of diff rule set values."
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/DiffRuleSet'}, description: "contains the ordered items associated with this diff rule set list."}}
    SearchFilter:
      description: "defines supported filters for selecting search records."
      type: object
      additionalProperties: false
      properties:
        repositoryIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered repository ids associated with this search filter."}
        serviceIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered service ids associated with this search filter."}
        teamIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered team ids associated with this search filter."}
        groupIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered group ids associated with this search filter."}
        kinds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/KindId'}, description: "contains the ordered kinds associated with this search filter."}
        lifecycles: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Lifecycle'}, description: "contains the ordered lifecycles associated with this search filter."}
        tagIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered tag ids associated with this search filter."}
        languages: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 64}, description: "contains the ordered languages associated with this search filter."}
        itemTypes: {type: array, uniqueItems: true, items: {type: string}, description: "contains the ordered item types associated with this search filter."}
        hasAiLayer: {type: boolean, description: "indicates whether ai layer applies to this search filter."}
        hasBreakingChanges: {type: boolean, description: "indicates whether breaking changes applies to this search filter."}
    SearchHit:
      description: "represents search hit data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [type, id, title, subtitle, score, repository, service, kind, deepLink, highlights]
      properties:
        type: {type: string, enum: [repository, service, asset, item], description: "specifies the type associated with this search hit."}
        id: {type: string, description: "uniquely identifies this resource."}
        title: {type: string, description: "specifies the title associated with this search hit."}
        subtitle: {type: [string, 'null'], description: "specifies the subtitle associated with this search hit."}
        score: {type: number, description: "specifies the score associated with this search hit."}
        repository:
          oneOf: [{$ref: '#/components/schemas/RepositoryRef'}, {type: 'null'}]
          description: Non-null for every hit; repository hits use this as their owning resource.
        service:
          oneOf: [{$ref: '#/components/schemas/ServiceRef'}, {type: 'null'}]
          description: Null only for repository hits.
        kind: {oneOf: [{$ref: '#/components/schemas/KindId'}, {type: 'null'}], description: "specifies the kind associated with this search hit."}
        deepLink:
          oneOf:
            - {$ref: '#/components/schemas/SearchDeepLink'}
            - {type: 'null'}
          description: Required for asset and item hits; null for repository and service hits.
        highlights: {type: object, additionalProperties: {type: array, items: {type: string}}, description: "specifies the highlights associated with this search hit."}
    SearchDeepLink:
      description: "represents search deep link data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [assetId, versionId, itemKey]
      properties:
        assetId: {$ref: '#/components/schemas/Uuid', description: "identifies the asset associated with this resource."}
        versionId: {$ref: '#/components/schemas/Uuid', description: "identifies the asset version associated with this resource."}
        itemKey: {type: [string, 'null'], description: "specifies the item key associated with this search deep link."}
    SearchFacetBucket:
      description: "represents search facet bucket data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [value, count]
      properties: {value: {type: string, description: "specifies the value associated with this search facet bucket."}, count: {type: integer, minimum: 0, description: "specifies the count associated with this search facet bucket."}}
    SearchFacetSet:
      description: "represents search facet set data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [repositories, teams, groups, kinds, lifecycles, tags, languages, itemTypes, hasAiLayer, hasBreakingChanges]
      properties:
        repositories: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered repositories associated with this search facet set."}
        teams: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered teams associated with this search facet set."}
        groups: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered groups associated with this search facet set."}
        kinds: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered kinds associated with this search facet set."}
        lifecycles: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered lifecycles associated with this search facet set."}
        tags: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered tags associated with this search facet set."}
        languages: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered languages associated with this search facet set."}
        itemTypes: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "contains the ordered item types associated with this search facet set."}
        hasAiLayer: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "indicates whether ai layer applies to this search facet set."}
        hasBreakingChanges: {type: array, items: {$ref: '#/components/schemas/SearchFacetBucket'}, description: "indicates whether breaking changes applies to this search facet set."}
    SearchResult:
      description: "reports the result of the corresponding Meridian operation."
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - type: object
          required: [items, facets]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/SearchHit'}, description: "contains the ordered items associated with this search result."}
            facets: {$ref: '#/components/schemas/SearchFacetSet', description: "contains the search facet set associated with this search result."}
    ViewInputSpec:
      description: "represents view input spec data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [mode, kinds]
      properties:
        mode: {type: string, enum: [single, versions, collection, scope], description: "specifies the mode associated with this view input spec."}
        kinds: {oneOf: [{type: string, const: '*'}, {type: array, items: {$ref: '#/components/schemas/KindId'}}], description: "specifies the kinds associated with this view input spec."}
        scopes: {type: array, items: {type: string, enum: [service, system_group, tenant]}, description: "contains the ordered scopes associated with this view input spec."}
        minDocs: {type: integer, minimum: 1, description: "specifies the min docs associated with this view input spec."}
        maxDocs: {type: integer, minimum: 1, maximum: 50, description: "specifies the max docs associated with this view input spec."}
        sameKind: {type: boolean, description: "indicates whether same kind applies to this view input spec."}
        sameAsset: {type: boolean, description: "indicates whether same asset applies to this view input spec."}
    ViewDefinition:
      description: "represents view definition data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, nameKey, milestone, mount, input, defaultOptions, optionsSchema]
      properties:
        id: {type: string, description: "uniquely identifies this resource."}
        nameKey: {type: string, description: "specifies the name key associated with this view definition."}
        milestone: {type: string, pattern: '^M[0-9]+$', description: "specifies the milestone associated with this view definition."}
        mount: {type: string, enum: [component, iframe, external], description: "specifies the mount associated with this view definition."}
        component: {type: string, description: "specifies the component associated with this view definition."}
        entrypoint: {type: string, description: "specifies the entrypoint associated with this view definition."}
        externalUrl: {type: string, format: uri, description: "specifies the external url associated with this view definition."}
        input: {$ref: '#/components/schemas/ViewInputSpec', description: "contains the view input spec associated with this view definition."}
        itemTypes: {type: array, items: {type: string}, description: "contains the ordered item types associated with this view definition."}
        columns: {type: array, items: {type: object, additionalProperties: true}, description: "contains the ordered columns associated with this view definition."}
        columnsSource: {type: string, description: "specifies the columns source associated with this view definition."}
        fallbackColumns: {type: array, items: {type: object, additionalProperties: true}, description: "contains the ordered fallback columns associated with this view definition."}
        query: {type: object, additionalProperties: true, description: "specifies the query associated with this view definition."}
        defaultOptions: {type: object, additionalProperties: true, description: "specifies the default options associated with this view definition."}
        optionsSchema: {type: object, additionalProperties: true, description: "specifies the options schema associated with this view definition."}
    ViewList:
      description: "contains an ordered collection of view values."
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ViewDefinition'}, description: "contains the ordered items associated with this view list."}}
    ViewResolveRequest:
      type: object
      additionalProperties: false
      required: [viewId]
      properties:
        viewId: {type: string, description: "specifies the view id associated with this view resolve request."}
        inputs:
          type: array
          maxItems: 50
          default: []
          items: {$ref: '#/components/schemas/DocumentSelector'}
          description: Required by single, versions and collection views; omitted for scope views.
        scope:
          oneOf:
            - {$ref: '#/components/schemas/ScopeSelector'}
            - {type: 'null'}
          description: Required by scope views; omitted for document-input views.
        options: {type: object, additionalProperties: true, description: "specifies the options associated with this view resolve request."}
      description: Input arity and kind constraints are validated from the selected entry in views.yaml.
    ScopeSelector:
      description: "identifies the scope selected by a request."
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {type: string, enum: [service, system_group, tenant], description: "specifies the type associated with this scope selector."}
        id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Must be null for tenant and non-null for service or system_group.
    PublicViewResolveRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [viewId, kind, assetName]
      properties:
        viewId: {type: string, enum: [swagger-ui, redoc, source], description: "specifies the view id associated with this public view resolve request."}
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this public view resolve request."}
        assetName: {$ref: '#/components/schemas/AssetName', description: "contains the asset name associated with this public view resolve request."}
        options: {type: object, additionalProperties: true, description: "specifies the options associated with this public view resolve request."}
    DocumentViewResolution:
      description: "represents document view resolution data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [kind, view, document]
      properties:
        kind: {type: string, const: document, description: "specifies the kind associated with this document view resolution."}
        view: {$ref: '#/components/schemas/ViewDefinition', description: "contains the view definition associated with this document view resolution."}
        document: {$ref: '#/components/schemas/ArtifactLink', description: "contains the artifact link associated with this document view resolution."}
    ItemsViewResolution:
      description: "represents items view resolution data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [kind, view, items]
      properties:
        kind: {type: string, const: items, description: "specifies the kind associated with this items view resolution."}
        view: {$ref: '#/components/schemas/ViewDefinition', description: "contains the view definition associated with this items view resolution."}
        items: {type: array, items: {$ref: '#/components/schemas/AssetItem'}, description: "contains the ordered items associated with this items view resolution."}
    GraphNode:
      description: "represents graph node data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, label, serviceId]
      properties: {id: {type: string, description: "uniquely identifies this resource."}, label: {type: string, description: "specifies the label associated with this graph node."}, serviceId: {$ref: '#/components/schemas/Uuid', description: "identifies the service associated with this resource."}}
    GraphEdge:
      description: "represents graph edge data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, from, to, details]
      properties: {id: {type: string, description: "uniquely identifies this resource."}, from: {type: string, description: "specifies the from associated with this graph edge."}, to: {type: string, description: "specifies the to associated with this graph edge."}, details: {type: object, additionalProperties: true, description: "specifies the details associated with this graph edge."}}
    GraphViewResolution:
      description: "represents graph view resolution data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [kind, view, nodes, edges, truncated]
      properties:
        kind: {type: string, const: dep_graph, description: "specifies the kind associated with this graph view resolution."}
        view: {$ref: '#/components/schemas/ViewDefinition', description: "contains the view definition associated with this graph view resolution."}
        nodes: {type: array, items: {$ref: '#/components/schemas/GraphNode'}, description: "contains the ordered nodes associated with this graph view resolution."}
        edges: {type: array, items: {$ref: '#/components/schemas/GraphEdge'}, description: "contains the ordered edges associated with this graph view resolution."}
        truncated: {type: boolean, description: "indicates whether truncated applies to this graph view resolution."}
    DashboardViewResolution:
      description: "represents dashboard view resolution data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [kind, view, metrics]
      properties:
        kind: {type: string, const: catalog_dashboard, description: "specifies the kind associated with this dashboard view resolution."}
        view: {$ref: '#/components/schemas/ViewDefinition', description: "contains the view definition associated with this dashboard view resolution."}
        metrics: {type: object, additionalProperties: true, description: "specifies the metrics associated with this dashboard view resolution."}
    ViewResolution:
      description: "represents view resolution data exchanged through the Meridian API."
      oneOf:
        - {$ref: '#/components/schemas/DocumentViewResolution'}
        - {$ref: '#/components/schemas/ItemsViewResolution'}
        - {$ref: '#/components/schemas/GraphViewResolution'}
        - {$ref: '#/components/schemas/DashboardViewResolution'}
      discriminator: {propertyName: kind}
    ShareLinkCreateRequest:
      type: object
      additionalProperties: false
      required: [resourceType, viewId, expiresInSeconds]
      properties:
        resourceType: {type: string, const: view, description: "specifies the resource type associated with this share link create request."}
        viewId: {type: string, minLength: 1, maxLength: 64, description: "specifies the view id associated with this share link create request."}
        inputs:
          description: "contains the ordered inputs associated with this share link create request."
          type: array
          maxItems: 50
          default: []
          items: {$ref: '#/components/schemas/DocumentSelector'}
        scope:
          description: "specifies the scope associated with this share link create request."
          oneOf: [{$ref: '#/components/schemas/ScopeSelector'}, {type: 'null'}]
        options: {type: object, additionalProperties: true, description: "specifies the options associated with this share link create request."}
        expiresInSeconds: {type: integer, minimum: 300, maximum: 2592000, description: "specifies the expires in seconds associated with this share link create request."}
      description: >-
        Creates a view share. The server resolves all ref selectors to immutable version IDs,
        freezes scope membership and options, and allowlists only the resulting artifacts.
        Diff snapshots use the dedicated diff-snapshot share operation.
    ShareLink:
      description: "represents share link data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, resourceType, resourceId, descriptorDigest, url, expiresAt, revokedAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
        resourceType: {type: string, enum: [view, diff_snapshot], description: "specifies the resource type associated with this share link."}
        resourceId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Diff snapshot ID; null for a frozen view descriptor.
        descriptorDigest: {type: string, description: "specifies the descriptor digest associated with this share link."}
        url: {type: string, format: uri-reference, description: "specifies the url associated with this share link."}
        expiresAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant after which this value is invalid."}
        revokedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}], description: "specifies the revoked at associated with this share link."}
        createdAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was created."}
    ShareLinkCreated:
      description: "represents share link created data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, token, resourceType, resourceId, descriptorDigest, url, expiresAt, revokedAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid', description: "uniquely identifies this resource."}
