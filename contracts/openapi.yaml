      properties:
        pointer: {type: string, description: "specifies the pointer associated with this config field diff."}
        databaseValue: {description: "specifies the database value associated with this config field diff."}
        fileValue: {description: "specifies the file value associated with this config field diff."}
        source: {$ref: '#/components/schemas/ConfigSource', description: "contains the config source associated with this config field diff."}
    ConfigImportPreview:
      description: "represents config import preview data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [previewId, repositoryId, commit, configDigest, services, sources, drift, expiresAt]
      properties:
        previewId: {$ref: '#/components/schemas/Uuid', description: "contains the uuid associated with this config import preview."}
        repositoryId: {$ref: '#/components/schemas/Uuid', description: "identifies the repository associated with this resource."}
        commit: {type: string, description: "specifies the commit associated with this config import preview."}
        configDigest: {type: string, description: "is the lowercase SHA-256 digest of the normalized configuration."}
        services: {type: array, items: {$ref: '#/components/schemas/Service'} , description: "contains the ordered services associated with this config import preview."}
        sources: {type: array, items: {$ref: '#/components/schemas/SourceSpec'} , description: "contains the ordered sources associated with this config import preview."}
        drift: {type: array, items: {$ref: '#/components/schemas/ConfigFieldDiff'}, description: "contains the ordered drift associated with this config import preview."}
        expiresAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant after which this value is invalid."}
    ConfigImportApplyRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [configDigest, defaultResolution]
      properties:
        configDigest: {type: string, description: "is the lowercase SHA-256 digest of the normalized configuration."}
        defaultResolution: {type: string, enum: [keep_db, take_file], description: "specifies the default resolution associated with this config import apply request."}
        replaceAiBases:
          type: boolean
          default: false
          description: Explicitly applies the domain baseReplacement transaction for matching repository bases.
        fieldResolutions:
          description: "specifies the field resolutions associated with this config import apply request."
          type: object
          additionalProperties: {type: string, enum: [keep_db, take_file]}
    ConfigImportResult:
      description: "reports the result of the corresponding Meridian operation."
      type: object
      additionalProperties: false
      required: [repositoryId, commit, configDigest, createdServiceIds, updatedServiceIds, sourceSpecIds]
      properties:
        repositoryId: {$ref: '#/components/schemas/Uuid', description: "identifies the repository associated with this resource."}
        commit: {type: string, description: "specifies the commit associated with this config import result."}
        configDigest: {type: string, description: "is the lowercase SHA-256 digest of the normalized configuration."}
        createdServiceIds: {type: array, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered created service ids associated with this config import result."}
        updatedServiceIds: {type: array, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered updated service ids associated with this config import result."}
        sourceSpecIds: {type: array, items: {$ref: '#/components/schemas/Uuid'}, description: "contains the ordered source spec ids associated with this config import result."}
    AssetKind:
      description: "represents asset kind data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [id, etag, enabled, milestone, acceptedMediaTypes, capabilities, defaultViews, schemaVersion]
      properties:
        id: {$ref: '#/components/schemas/KindId', description: "uniquely identifies this resource."}
        etag: {$ref: '#/components/schemas/ETag', description: "is the opaque entity tag required for optimistic concurrency control."}
        enabled: {type: boolean, description: "indicates whether enabled applies to this asset kind."}
        milestone: {type: string, pattern: '^M[0-9]+$', description: "specifies the milestone associated with this asset kind."}
        acceptedMediaTypes: {type: array, items: {type: string}, description: "contains the ordered accepted media types associated with this asset kind."}
        capabilities: {$ref: '#/components/schemas/CapabilityList', description: "lists actions the authenticated principal may perform on this resource."}
        defaultViews: {type: array, items: {type: string}, description: "contains the ordered default views associated with this asset kind."}
        schemaVersion: {type: integer, minimum: 1, description: "specifies the schema version associated with this asset kind."}
    AssetKindList:
      description: "contains an ordered collection of asset kind values."
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/AssetKind'}, description: "contains the ordered items associated with this asset kind list."}}
    AssetKindPatchRequest:
      description: "defines validated input for the corresponding Meridian API operation."
      type: object
      additionalProperties: false
      required: [enabled]
      properties: {enabled: {type: boolean, description: "indicates whether enabled applies to this asset kind patch request."}}
    ViewOverrideValue:
      description: "represents view override value data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean, description: "indicates whether enabled applies to this view override value."}
        defaultOptions: {type: object, additionalProperties: true, description: "specifies the default options associated with this view override value."}
    ViewOverride:
      description: "represents view override data exchanged through the Meridian API."
      type: object
