        mode: {type: string, enum: [single, versions, collection, scope]}
        kinds: {oneOf: [{type: string, const: '*'}, {type: array, items: {$ref: '#/components/schemas/KindId'}}]}
        scopes: {type: array, items: {type: string, enum: [service, system_group, tenant]}}
        minDocs: {type: integer, minimum: 1}
        maxDocs: {type: integer, minimum: 1, maximum: 50}
        sameKind: {type: boolean}
        sameAsset: {type: boolean}
    ViewDefinition:
      type: object
      additionalProperties: false
      required: [id, nameKey, milestone, mount, input, defaultOptions, optionsSchema]
      properties:
        id: {type: string}
        nameKey: {type: string}
        milestone: {type: string, pattern: '^M[0-9]+$'}
        mount: {type: string, enum: [component, iframe, external]}
        component: {type: string}
        entrypoint: {type: string}
        externalUrl: {type: string, format: uri}
        input: {$ref: '#/components/schemas/ViewInputSpec'}
        itemTypes: {type: array, items: {type: string}}
        columns: {type: array, items: {type: object, additionalProperties: true}}
        columnsSource: {type: string}
        fallbackColumns: {type: array, items: {type: object, additionalProperties: true}}
        query: {type: object, additionalProperties: true}
        defaultOptions: {type: object, additionalProperties: true}
        optionsSchema: {type: object, additionalProperties: true}
    ViewList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ViewDefinition'}}}
    ViewResolveRequest:
      type: object
      additionalProperties: false
      required: [viewId]
      properties:
        viewId: {type: string}
        inputs:
          type: array
          maxItems: 50
          default: []
          items: {$ref: '#/components/schemas/DocumentSelector'}
          description: Required by single, versions and collection views; omitted for scope views.
        scope:
          oneOf:
            - {$ref: '#/components/schemas/ScopeSelector'}
            - {type: 'null'}
          description: Required by scope views; omitted for document-input views.
        options: {type: object, additionalProperties: true}
      description: Input arity and kind constraints are validated from the selected entry in views.yaml.
    ScopeSelector:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {type: string, enum: [service, system_group, tenant]}
        id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Must be null for tenant and non-null for service or system_group.
    PublicViewResolveRequest:
      type: object
      additionalProperties: false
      required: [viewId, kind, assetName]
      properties:
        viewId: {type: string, enum: [swagger-ui, redoc, source]}
        kind: {$ref: '#/components/schemas/KindId'}
        assetName: {$ref: '#/components/schemas/AssetName'}
        options: {type: object, additionalProperties: true}
    DocumentViewResolution:
      type: object
      additionalProperties: false
      required: [kind, view, document]
      properties:
        kind: {type: string, const: document}
        view: {$ref: '#/components/schemas/ViewDefinition'}
        document: {$ref: '#/components/schemas/ArtifactLink'}
    ItemsViewResolution:
      type: object
      additionalProperties: false
      required: [kind, view, items]
      properties:
        kind: {type: string, const: items}
        view: {$ref: '#/components/schemas/ViewDefinition'}
        items: {type: array, items: {$ref: '#/components/schemas/AssetItem'}}
    GraphNode:
      type: object
      additionalProperties: false
      required: [id, label, serviceId]
      properties: {id: {type: string}, label: {type: string}, serviceId: {$ref: '#/components/schemas/Uuid'}}
    GraphEdge:
      type: object
      additionalProperties: false
      required: [id, from, to, details]
      properties: {id: {type: string}, from: {type: string}, to: {type: string}, details: {type: object, additionalProperties: true}}
    GraphViewResolution:
      type: object
      additionalProperties: false
      required: [kind, view, nodes, edges, truncated]
      properties:
        kind: {type: string, const: dep_graph}
        view: {$ref: '#/components/schemas/ViewDefinition'}
        nodes: {type: array, items: {$ref: '#/components/schemas/GraphNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/GraphEdge'}}
        truncated: {type: boolean}
    DashboardViewResolution:
      type: object
      additionalProperties: false
      required: [kind, view, metrics]
      properties:
        kind: {type: string, const: catalog_dashboard}
        view: {$ref: '#/components/schemas/ViewDefinition'}
        metrics: {type: object, additionalProperties: true}
    ViewResolution:
      oneOf:
        - {$ref: '#/components/schemas/DocumentViewResolution'}
        - {$ref: '#/components/schemas/ItemsViewResolution'}
        - {$ref: '#/components/schemas/GraphViewResolution'}
        - {$ref: '#/components/schemas/DashboardViewResolution'}
      discriminator: {propertyName: kind}
    ShareLinkCreateRequest:
      type: object
      additionalProperties: false
      required: [resourceType, viewId, expiresInSeconds]
      properties:
        resourceType: {type: string, const: view}
        viewId: {type: string, minLength: 1, maxLength: 64}
        inputs:
          type: array
          maxItems: 50
          default: []
          items: {$ref: '#/components/schemas/DocumentSelector'}
        scope:
          oneOf: [{$ref: '#/components/schemas/ScopeSelector'}, {type: 'null'}]
        options: {type: object, additionalProperties: true}
        expiresInSeconds: {type: integer, minimum: 300, maximum: 2592000}
      description: >-
        Creates a view share. The server resolves all ref selectors to immutable version IDs,
        freezes scope membership and options, and allowlists only the resulting artifacts.
        Diff snapshots use the dedicated diff-snapshot share operation.
    ShareLink:
      type: object
      additionalProperties: false
      required: [id, resourceType, resourceId, descriptorDigest, url, expiresAt, revokedAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        resourceType: {type: string, enum: [view, diff_snapshot]}
        resourceId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Diff snapshot ID; null for a frozen view descriptor.
        descriptorDigest: {type: string}
        url: {type: string, format: uri-reference}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        revokedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    ShareLinkCreated:
      type: object
      additionalProperties: false
      required: [id, token, resourceType, resourceId, descriptorDigest, url, expiresAt, revokedAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        token: {type: string, writeOnly: true, minLength: 32}
        resourceType: {type: string, enum: [view, diff_snapshot]}
        resourceId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        descriptorDigest: {type: string}
        url: {type: string, format: uri-reference}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        revokedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    ShareLinkPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ShareLink'}}}}
    SharedView:
      type: object
      additionalProperties: false
      required: [resourceType, expiresAt, resolution]
      properties:
        resourceType: {type: string, enum: [view, diff_snapshot]}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        resolution: {oneOf: [{$ref: '#/components/schemas/ViewResolution'}, {$ref: '#/components/schemas/DiffSnapshot'}]}
    SystemGroup:
      type: object
      additionalProperties: false
      required: [id, etag, parentId, slug, displayName, description, serviceIds, capabilities, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        etag: {$ref: '#/components/schemas/ETag'}
        parentId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        slug: {$ref: '#/components/schemas/Slug'}
        displayName: {type: string}
        description: {type: [string, 'null']}
        serviceIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        capabilities: {$ref: '#/components/schemas/CapabilityList'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SystemGroupCreateRequest:
      type: object
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug: {$ref: '#/components/schemas/Slug'}
        displayName: {type: string, minLength: 1, maxLength: 128}
        description: {type: [string, 'null'], maxLength: 2000}
        parentId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        serviceIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    SystemGroupPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 128}
        description: {type: [string, 'null'], maxLength: 2000}
        parentId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
    SystemGroupMembersReplaceRequest:
      type: object
      additionalProperties: false
      required: [serviceIds]
      properties: {serviceIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}}
    SystemGroupList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SystemGroup'}}}
    JobStageAttempt:
      type: object
      additionalProperties: false
      required: [stage, attempt, status, startedAt, finishedAt, error]
      properties:
        stage: {$ref: '#/components/schemas/PipelineStage'}
        attempt: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/JobStatus'}
        startedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        finishedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        error: {oneOf: [{$ref: '#/components/schemas/ErrorResponse'}, {type: 'null'}]}
    Job:
      type: object
      additionalProperties: false
      required: [id, tenantSlug, retryOfJobId, type, trigger, status, stage, scopeType, scopeId, refType, ref, result, progress, dirty, attempt, maxAttempts, nextAttemptAt, attempts, error, createdAt, startedAt, finishedAt, capabilities]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tenantSlug: {$ref: '#/components/schemas/Slug'}
        retryOfJobId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        type: {$ref: '#/components/schemas/JobType'}
        trigger: {$ref: '#/components/schemas/JobTrigger'}
        status: {$ref: '#/components/schemas/JobStatus'}
        stage: {oneOf: [{$ref: '#/components/schemas/PipelineStage'}, {type: 'null'}]}
        scopeType: {$ref: '#/components/schemas/JobScopeType'}
        scopeId: {type: [string, 'null']}
        refType: {oneOf: [{$ref: '#/components/schemas/RefType'}, {type: 'null'}]}
        ref: {oneOf: [{$ref: '#/components/schemas/RefName'}, {type: 'null'}]}
        result: {type: [object, 'null'], additionalProperties: true, description: Operation-specific non-secret result identifiers and counters.}
        progress: {type: integer, minimum: 0, maximum: 100}
        dirty: {type: boolean}
        attempt: {type: integer, minimum: 0}
        maxAttempts: {type: integer, minimum: 1}
        nextAttemptAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        attempts: {type: array, items: {$ref: '#/components/schemas/JobStageAttempt'}}
        error: {oneOf: [{$ref: '#/components/schemas/ErrorResponse'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        startedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        finishedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        capabilities: {$ref: '#/components/schemas/CapabilityList'}
    JobAccepted:
      type: object
      additionalProperties: false
      required: [jobId, deduplicated]
      properties:
        jobId: {$ref: '#/components/schemas/Uuid'}
        deduplicated: {type: boolean}
    JobPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Job'}}}}
    PlatformJob:
      type: object
      additionalProperties: false
      required: [id, tenantSlug, type, trigger, status, stage, scopeType, scopeId, createdAt, startedAt, finishedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tenantSlug: {$ref: '#/components/schemas/Slug'}
        type: {$ref: '#/components/schemas/JobType'}
        trigger: {$ref: '#/components/schemas/JobTrigger'}
        status: {$ref: '#/components/schemas/JobStatus'}
        stage: {oneOf: [{$ref: '#/components/schemas/PipelineStage'}, {type: 'null'}]}
        scopeType: {$ref: '#/components/schemas/JobScopeType'}
        scopeId: {type: [string, 'null'], description: 'Exposed only for tenant or repository scope; null for service, asset, version, layer, and other business scopes.'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        startedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        finishedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    PlatformJobPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PlatformJob'}}}}
    JobFilter:
      type: object
      additionalProperties: false
      properties:
        types: {type: array, items: {$ref: '#/components/schemas/JobType'}}
        statuses: {type: array, items: {$ref: '#/components/schemas/JobStatus'}}
        scopeType: {$ref: '#/components/schemas/JobScopeType'}
        scopeId: {type: string}
    PlatformJobFilter:
      type: object
      additionalProperties: false
      properties:
        types: {type: array, items: {$ref: '#/components/schemas/JobType'}}
        statuses: {type: array, items: {$ref: '#/components/schemas/JobStatus'}}
        scopeType: {$ref: '#/components/schemas/JobScopeType'}
        scopeId: {type: string}
        tenantSlug: {$ref: '#/components/schemas/Slug'}
    JobLogEvent:
      type: object
      additionalProperties: false
      required: [event, id, at, message]
      properties:
        event: {type: string, const: log}
        id: {type: string}
        at: {$ref: '#/components/schemas/Timestamp'}
        message: {type: string}
        stage: {oneOf: [{$ref: '#/components/schemas/PipelineStage'}, {type: 'null'}]}
    JobStateEvent:
      type: object
      additionalProperties: false
      required: [event, id, at, status, progress]
      properties:
        event: {type: string, const: state}
        id: {type: string}
        at: {$ref: '#/components/schemas/Timestamp'}
        status: {$ref: '#/components/schemas/JobStatus'}
        progress: {type: integer, minimum: 0, maximum: 100}
    JobSseEvent:
      oneOf:
        - {$ref: '#/components/schemas/JobLogEvent'}
        - {$ref: '#/components/schemas/JobStateEvent'}
      discriminator: {propertyName: event}
    DomainEventType:
      type: string
      enum: [version.published, version.breaking, collect.failed, service.deprecated, ai_layer.generated, layer.approved, layer.rejected]
    SubscriptionScopeType:
      type: string
      enum: [tenant, service, asset, system_group, asset_kind]
    SubscriptionScopeConstraints:
      type: object
      allOf:
        - if: {properties: {scopeType: {const: tenant}}, required: [scopeType]}
          then: {properties: {scopeId: {type: 'null'}}, required: [scopeId]}
        - if: {properties: {scopeType: {const: asset_kind}}, required: [scopeType]}
          then: {properties: {scopeId: {$ref: '#/components/schemas/KindId'}}, required: [scopeId]}
        - if: {properties: {scopeType: {enum: [service, asset, system_group]}}, required: [scopeType]}
          then: {properties: {scopeId: {$ref: '#/components/schemas/Uuid'}}, required: [scopeId]}
    Subscription:
      type: object
      additionalProperties: false
      required: [id, eventTypes, scopeType, scopeId, channelIds, enabled, createdAt, updatedAt]
      allOf: [{$ref: '#/components/schemas/SubscriptionScopeConstraints'}]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        eventTypes: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/DomainEventType'}}
        scopeType: {$ref: '#/components/schemas/SubscriptionScopeType'}
        scopeId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {$ref: '#/components/schemas/KindId'}, {type: 'null'}]}
        channelIds: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        enabled: {type: boolean}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    SubscriptionPutRequest:
      type: object
      additionalProperties: false
      required: [eventTypes, scopeType, scopeId, channelIds, enabled]
      allOf: [{$ref: '#/components/schemas/SubscriptionScopeConstraints'}]
      properties:
        eventTypes: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/DomainEventType'}}
        scopeType: {$ref: '#/components/schemas/SubscriptionScopeType'}
        scopeId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {$ref: '#/components/schemas/KindId'}, {type: 'null'}]}
        channelIds: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        enabled: {type: boolean}
    SubscriptionList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Subscription'}}}
    Notification:
      type: object
      additionalProperties: false
      required: [id, eventType, title, body, resourceUrl, readAt, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        eventType: {$ref: '#/components/schemas/DomainEventType'}
        title: {type: string}
        body: {type: string}
        resourceUrl: {type: [string, 'null'], format: uri-reference}
        readAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    NotificationPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items, unreadCount], properties: {items: {type: array, items: {$ref: '#/components/schemas/Notification'}}, unreadCount: {type: integer, minimum: 0}}}
    BreakingTodo:
      type: object
      additionalProperties: false
      required: [id, assetVersionId, assigneeId, status, summary, comment, createdAt, acknowledgedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        assetVersionId: {$ref: '#/components/schemas/Uuid'}
        assigneeId: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/TodoStatus'}
        summary: {$ref: '#/components/schemas/DiffCounts'}
        comment: {type: [string, 'null']}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        acknowledgedAt: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    BreakingTodoAcknowledgeRequest:
      type: object
      additionalProperties: false
      properties: {comment: {type: [string, 'null'], maxLength: 2000}}
    BreakingTodoPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/BreakingTodo'}}}}
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, tenantSlug, actorId, action, resourceType, resourceId, requestId, metadata, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tenantSlug: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}]}
        actorId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: [string, 'null']}
        requestId: {type: [string, 'null']}
        metadata: {type: object, additionalProperties: true}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    AuditLogPage:
      allOf:
        - {$ref: '#/components/schemas/PageInfo'}
        - {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}}}
    AuditFilter:
      type: object
      additionalProperties: false
      properties:
        actorId: {$ref: '#/components/schemas/Uuid'}
        actions: {type: array, items: {type: string}}
        resourceType: {type: string}
        resourceId: {type: string}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
    PlatformAuditFilter:
      type: object
      additionalProperties: false
      properties:
        actorId: {$ref: '#/components/schemas/Uuid'}
        actions: {type: array, items: {type: string}}
        resourceType: {type: string}
        resourceId: {type: string}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        tenantSlug: {$ref: '#/components/schemas/Slug'}
