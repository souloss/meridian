      x-details-by-code:
        validation_error:
          fields: FieldError[]
          unknownFields: string[]
        asset_path_not_found:
          candidates: '[{path,reason}]'
        overlay_invalid:
          errors: '[{line,column,message}]'
          coordinates: 1-based
        version_not_publishable:
          blockingRevisions: '[{revisionId,layerId,status}]'
