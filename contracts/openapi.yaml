        $ref: '#/components/schemas/Uuid'
    TeamId:
      name: teamId
      in: path
      required: true
      description: identifies or filters the team id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      description: identifies the tenant that scopes this request.
      schema:
        $ref: '#/components/schemas/Slug'
    TodoId:
      name: todoId
      in: path
      required: true
      description: identifies or filters the todo id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    TodoStatusFilter:
      name: status
      in: query
      required: false
      description: identifies or filters the status value in the query.
      schema:
        $ref: '#/components/schemas/TodoStatus'
    TokenId:
      name: tokenId
      in: path
      required: true
      description: identifies or filters the token id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    UnreadFilter:
      name: unread
      in: query
      required: false
      description: identifies or filters the unread value in the query.
      schema:
        type: boolean
    UserId:
      name: userId
      in: path
      required: true
      description: identifies or filters the user id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    VersionId:
      name: versionId
      in: path
      required: true
      description: identifies or filters the version id value in the path.
      schema:
        $ref: '#/components/schemas/Uuid'
    ViewId:
      name: viewId
      in: path
      required: true
      description: identifies or filters the view id value in the path.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    WebhookDelivery:
      name: x-meridian-delivery
      in: header
      required: true
      description: identifies or filters the x meridian delivery value in the header.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WebhookEvent:
      name: x-meridian-event
      in: header
      required: true
      description: identifies or filters the x meridian event value in the header.
      schema:
        type: string
        enum:
        - push
    WebhookSignature:
      name: x-meridian-signature-256
      in: header
      required: true
      description: identifies or filters the x meridian signature 256 value in the header.
      schema:
        type: string
        pattern: ^sha256=[0-9a-f]{64}$
  schemas:
    AiGenerationAccepted:
      type: object
      required:
      - assetId
      - sourceId
      - jobId
      - deduplicated
      properties:
        assetId:
          $ref: '#/components/schemas/Uuid'
          description: identifies the asset associated with this resource.
        sourceId:
          $ref: '#/components/schemas/Uuid'
          description: identifies the source associated with this resource.
        jobId:
          $ref: '#/components/schemas/Uuid'
          description: identifies the asynchronous job associated with this resource.
        deduplicated:
          type: boolean
          description: indicates whether deduplicated applies to this ai generation accepted.
      description: represents ai generation accepted data exchanged through the Meridian API.
    ApiToken:
      type: object
      required:
      - id
      - name
      - scopes
      - expiresAt
      - lastUsedAt
      - revokedAt
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: uniquely identifies this resource.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: specifies the name associated with this api token.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/TokenScope'
          minItems: 1
          description: lists the explicit capabilities granted to this token.
        expiresAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: is the RFC 3339 UTC instant after which this value is invalid.
        lastUsedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: is the most recent successful authentication instant, or null when unused.
        revokedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: is the revocation instant, or null while the token remains active.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: is the RFC 3339 UTC instant when this resource was created.
      description: exposes PAT metadata without returning the bearer token or stored token hash.
    ArtifactLink:
      type: object
      required:
      - url
      - expiresAt
      properties:
        url:
          type: string
          format: uri-reference
          description: specifies the url associated with this artifact link.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: is the RFC 3339 UTC instant after which this value is invalid.
      description: represents artifact link data exchanged through the Meridian API.
    Asset:
      type: object
      required:
      - id
      - etag
      - serviceId
      - kind
      - name
      - lifecycle
      - health
      - qualityScore
      - currentVersion
      - latestVersion
      - refType
      - ref
      - layers
      - capabilities
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: uniquely identifies this resource.
        etag:
          $ref: '#/components/schemas/ETag'
          description: is the opaque entity tag required for optimistic concurrency control.
        serviceId:
          $ref: '#/components/schemas/Uuid'
          description: identifies the service associated with this resource.
        kind:
          $ref: '#/components/schemas/KindId'
          description: contains the kind id associated with this asset.
        name:
          $ref: '#/components/schemas/AssetName'
          description: contains the asset name associated with this asset.
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
          description: of currentVersion, otherwise latestVersion, otherwise draft for the selected ref Track.
        health:
          type: string
          enum:
          - ok
          - stale
          - invalid
          description: specifies the health associated with this asset.
        qualityScore:
          anyOf:
          - type: integer
          - type: 'null'
          minimum: 0
          maximum: 100
          description: specifies the quality score associated with this asset.
        currentVersion:
          oneOf:
          - $ref: '#/components/schemas/VersionRef'
          - type: 'null'
          description: specifies the current version associated with this asset.
        latestVersion:
          oneOf:
          - $ref: '#/components/schemas/VersionRef'
          - type: 'null'
          description: specifies the latest version associated with this asset.
        refType:
          $ref: '#/components/schemas/RefType'
          description: contains the ref type associated with this asset.
        ref:
          $ref: '#/components/schemas/RefName'
          description: contains the ref name associated with this asset.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerSummary'
          description: contains the ordered layers associated with this asset.
        capabilities:
          $ref: '#/components/schemas/CapabilityList'
          description: lists actions the authenticated principal may perform on this resource.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: is the RFC 3339 UTC instant when this resource was created.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: is the RFC 3339 UTC instant when this resource was last updated.
      description: represents asset data exchanged through the Meridian API.
    AssetAiGenerateRequest:
      type: object
      properties:
        sourceId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: identifies the source associated with this resource.
        refType:
          $ref: '#/components/schemas/RefType'
          description: contains the ref type associated with this asset ai generate request.
        ref:
          $ref: '#/components/schemas/RefName'
          description: contains the ref name associated with this asset ai generate request.
        hint:
          anyOf:
          - type: string
          - type: 'null'
          maxLength: 500
          description: specifies the hint associated with this asset ai generate request.
        producerProfileId:
          $ref: '#/components/schemas/Uuid'
          description: contains the uuid associated with this asset ai generate request.
      description: defines validated input for the corresponding Meridian API operation.
    AssetItem:
      type: object
      required:
      - itemType
      - key
      - display
      - provenance
      properties:
        itemType:
          type: string
          description: specifies the item type associated with this asset item.
        key:
          type: string
          description: specifies the key associated with this asset item.
        display:
          type: object
          unevaluatedProperties: {}
          description: specifies the display associated with this asset item.
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceEntry'
          description: contains the ordered provenance associated with this asset item.
      description: represents asset item data exchanged through the Meridian API.
    AssetItemPage:
      type: object
      required:
      - total
      - page
      - pageSize
      - items
      properties:
        total:
          type: integer
          minimum: 0
          description: is the number of matching records across all pages.
        page:
          type: integer
          minimum: 1
          description: is the one-based page number.
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: is the maximum number of records returned on one page.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetItem'
          description: contains the ordered items associated with this asset item page.
      description: contains one paginated page of asset item records.
    AssetKind:
      type: object
      required:
      - id
      - etag
      - enabled
      - milestone
      - acceptedMediaTypes
      - capabilities
      - defaultViews
      - schemaVersion
      properties:
        id:
          $ref: '#/components/schemas/KindId'
          description: uniquely identifies this resource.
        etag:
          $ref: '#/components/schemas/ETag'
          description: is the opaque entity tag required for optimistic concurrency control.
        enabled:
          type: boolean
          description: indicates whether enabled applies to this asset kind.
        milestone:
          type: string
          pattern: ^M[0-9]+$
          description: specifies the milestone associated with this asset kind.
        acceptedMediaTypes:
          type: array
          items:
            type: string
          description: contains the ordered accepted media types associated with this asset kind.
        capabilities:
          $ref: '#/components/schemas/CapabilityListItem'
          description: lists actions the authenticated principal may perform on this resource.
        defaultViews:
          type: array
          items:
            type: string
          description: contains the ordered default views associated with this asset kind.
        schemaVersion:
          type: integer
          minimum: 1
          description: specifies the schema version associated with this asset kind.
      description: represents asset kind data exchanged through the Meridian API.
    AssetKindList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetKind'
          description: contains the ordered items associated with this asset kind list.
      description: contains an ordered collection of asset kind values.
    AssetKindPatchRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: indicates whether enabled applies to this asset kind patch request.
      description: defines validated input for the corresponding Meridian API operation.
    AssetName:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,63}$
      description: is a stable lowercase asset identifier within one service and kind.
    AssetNameTemplate:
      type: string
      maxLength: 128
      pattern: ^(?:[a-z0-9-]|\{file_stem\}|\{parent_dir\})+$
      description: represents asset name template data exchanged through the Meridian API.
    AssetPushRequest:
      type: object
      required:
      - serviceSlug
      - kind
      - name
      - ref
      - sourceSystem
      - content
      - contentType
      properties:
        serviceSlug:
          $ref: '#/components/schemas/Slug'
          description: contains the slug associated with this asset push request.
        kind:
          $ref: '#/components/schemas/KindId'
          description: contains the kind id associated with this asset push request.
        name:
          $ref: '#/components/schemas/AssetName'
          description: contains the asset name associated with this asset push request.
        refType:
          $ref: '#/components/schemas/RefType'
          description: contains the ref type associated with this asset push request.
        ref:
          $ref: '#/components/schemas/RefName'
          description: contains the ref name associated with this asset push request.
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          description: specifies the source system associated with this asset push request.
        createIfMissing:
          type: boolean
          description: indicates whether create if missing applies to this asset push request.
        content:
          type: string
          maxLength: 1048576
          description: specifies the content associated with this asset push request.
        contentType:
          $ref: '#/components/schemas/ContentType'
          description: contains the content type associated with this asset push request.
