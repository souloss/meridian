      x-source-compatibility: ../contracts/domain.yaml#/sourceCompatibility
    SourceSpecInput:
      description: "represents source spec input data exchanged through the Meridian API."
      type: object
      additionalProperties: false
      required: [kind, role, origin, mode]
      properties:
        kind: {$ref: '#/components/schemas/KindId', description: "contains the kind id associated with this source spec input."}
        assetNameTemplate:
          description: "specifies the asset name template associated with this source spec input."
          allOf: [{$ref: '#/components/schemas/AssetNameTemplate'}]
          default: '{file_stem}'
        role: {$ref: '#/components/schemas/LayerRole', description: "contains the layer role associated with this source spec input."}
        origin: {$ref: '#/components/schemas/LayerOrigin', description: "contains the layer origin associated with this source spec input."}
        mode: {$ref: '#/components/schemas/SourceMode', description: "contains the source mode associated with this source spec input."}
        path: {type: [string, 'null'], maxLength: 512, format: repository-relative-glob, description: "specifies the path associated with this source spec input."}
        producerProfileId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}], description: "specifies the producer profile id associated with this source spec input."}
        ord: {type: integer, minimum: 0, default: 0, description: "specifies the ord associated with this source spec input."}
        timeoutSec: {type: integer, minimum: 10, maximum: 3600, description: Omitted values use the mode default in domain.yaml.}
        branchPatterns: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/RefGlob'}, default: ['**'], description: "contains the ordered branch patterns associated with this source spec input."}
        enabled: {type: boolean, default: true, description: "indicates whether enabled applies to this source spec input."}
        replaceAiBase:
          type: boolean
          default: false
          description: >-
            On create only, explicitly archives an existing AI-generated base and its source
            in the same transaction before creating this repository base. Invalid for other replacements.
        targetAssetId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Required only for manual mode; the asset must belong to the path service and match kind.
      x-source-compatibility: ../contracts/domain.yaml#/sourceCompatibility
      allOf:
        - if: {properties: {mode: {const: builtin}}, required: [mode]}
          then:
            required: [path]
            properties:
              origin: {const: repo}
              path: {type: string}
            not: {required: [producerProfileId]}
        - if: {properties: {mode: {const: command}}, required: [mode]}
          then:
            required: [producerProfileId]
            properties:
              origin: {const: repo}
              producerProfileId: {$ref: '#/components/schemas/Uuid'}
            not: {required: [path]}
        - if: {properties: {mode: {const: push}}, required: [mode]}
          then:
            properties: {origin: {const: third_party}}
            not: {anyOf: [{required: [path]}, {required: [producerProfileId]}]}
        - if: {properties: {mode: {const: manual}}, required: [mode]}
          then:
            required: [targetAssetId]
            properties: {origin: {const: manual}}
            not: {anyOf: [{required: [path]}, {required: [producerProfileId]}]}
        - if:
            properties: {mode: {not: {const: manual}}}
            required: [mode]
          then: {not: {required: [targetAssetId]}}
        - if: {properties: {mode: {const: ai}}, required: [mode]}
          then:
            required: [producerProfileId]
            properties:
              origin: {const: ai_generated}
              producerProfileId: {$ref: '#/components/schemas/Uuid'}
            not: {required: [path]}
        - if: {properties: {role: {const: base}}, required: [role]}
          then: {properties: {ord: {const: 0}}}
        - if: {properties: {replaceAiBase: {const: true}}, required: [replaceAiBase]}
          then:
            properties:
              role: {const: base}
              origin: {const: repo}
              mode: {enum: [builtin, command]}
