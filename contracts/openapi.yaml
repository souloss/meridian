            Non-null only for a manual SourceSpec. createSourceSpec atomically creates its
            one global SourceBinding and Layer and returns that Layer ID so the caller can
            immediately call createLayerRevision. Non-manual specs return null until jobs
            materialize zero or more bindings.
        createdAt: {$ref: '#/components/schemas/Timestamp', description: "is the RFC 3339 UTC instant when this resource was created."}
