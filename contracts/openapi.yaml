  schemas:
    Uuid: {type: string, format: uuid, description: UUID v7}
    ETag: {type: string, pattern: '^(W/)?"[^"]+"$', minLength: 3, maxLength: 128, description: Opaque HTTP entity tag including quotes}
    Timestamp: {type: string, format: date-time, description: RFC 3339 UTC}
    Slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: "is a stable lowercase URL identifier containing letters, digits, and hyphens."}
    AssetName: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: "is a stable lowercase asset identifier within one service and kind."}
    AssetNameTemplate: {type: string, maxLength: 128, pattern: '^(?:[a-z0-9-]|\{file_stem\}|\{parent_dir\})+$', description: "represents asset name template data exchanged through the Meridian API."}
    KindId: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', description: "identifies an asset kind registered in contracts/kinds.yaml."}
    GitRemoteUrl: {type: string, minLength: 1, maxLength: 2048, format: git-remote-url, description: 'HTTPS URL, ssh:// URL, or SCP-like user@host:path'}
    RefName: {type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/-]+$', format: git-ref-name, description: "is a validated Git branch or tag name without a refs prefix."}
    RefGlob: {type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/*?-]+$', format: git-ref-glob, description: "represents ref glob data exchanged through the Meridian API."}
    RefType: {type: string, enum: [branch, tag], default: branch, description: "identifies one supported ref type value."}
    Lifecycle: {type: string, enum: [draft, published, deprecated, retired], description: "identifies one supported lifecycle value."}
    ServiceVisibility: {type: string, enum: [private, internal, public], description: "identifies one supported service visibility value."}
