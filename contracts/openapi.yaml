openapi: 3.1.0
info:
  title: Meridian API
  version: 1.0.0
  description: >-
    Authoritative HTTP and DTO contract. Markdown documents are explanatory only.
    All tenant resource operations return 404 for both absence and authorization denial.
servers:
  - url: /
security:
  - cookieSession: []
  - patBearer: []
tags:
  - {name: System}
  - {name: Auth}
  - {name: Platform}
  - {name: Tenant}
  - {name: Repository}
  - {name: Service}
  - {name: Asset}
  - {name: Layer}
  - {name: Diff}
  - {name: View}
  - {name: Job}
  - {name: Collaboration}

paths:
  /healthz:
    get:
      description: "Reports whether the Meridian process is alive."
      operationId: healthz
      tags: [System]
      security: []
      x-tenant-scope: public
      x-permissions: []
      x-milestone: M0
      responses:
        '200': {$ref: '#/components/responses/Health'}
  /readyz:
    get:
      description: "Reports whether Meridian dependencies are ready to serve traffic."
      operationId: readyz
      tags: [System]
      security: []
      x-tenant-scope: public
      x-permissions: []
      x-milestone: M0
      responses:
        '200': {$ref: '#/components/responses/Health'}
        '503': {$ref: '#/components/responses/InternalError'}
  /metrics:
    get:
      description: "Returns deployment metrics in Prometheus text exposition format."
      operationId: metrics
      tags: [System]
      security: []
      x-tenant-scope: deployment-private
      x-permissions: []
      x-milestone: M5
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain: {schema: {type: string}}
  /api/v1/openapi.yaml:
    get:
      description: "Returns the exact OpenAPI contract embedded in this server build."
      operationId: getOpenApiContract
      tags: [System]
      security: []
      x-tenant-scope: public
      x-permissions: []
      x-milestone: M0
      responses:
        '200':
          description: This bundled contract
          content:
            application/yaml: {schema: {type: string}}
  /api/v1/version:
    get:
      description: "Returns the server build, API, and contract versions."
      operationId: getVersion
      tags: [System]
      security: []
      x-tenant-scope: public
      x-permissions: []
      x-milestone: M0
      responses:
        '200':
          description: Build and contract versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionInfo'}
  /api/v1/content/{token}:
    get:
      description: "Downloads signed content within the authorized request scope."
      operationId: downloadSignedContent
      tags: [System]
      security: []
      x-tenant-scope: public-signed-token
      x-permissions: []
      x-milestone: M1
      parameters:
        - {$ref: '#/components/parameters/ContentToken'}
      responses:
        '200':
          description: One artifact bound to the signed token
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/auth/csrf:
    get:
      description: "Returns a CSRF token bound to the current authenticated browser session."
      operationId: getCsrfToken
      tags: [Auth]
      security:
        - cookieSession: []
      x-tenant-scope: identity
      x-permissions: []
      x-milestone: M0
      responses:
        '200':
          description: CSRF token for the current browser session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfToken'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/login:
    post:
      description: "Authenticates local credentials and creates a browser session."
      operationId: login
      tags: [Auth]
      security: []
      x-tenant-scope: identity
      x-permissions: []
      x-idempotency: {mode: none}
      x-milestone: M0
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated; sets meridian_session
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/logout:
    post:
      description: "Revokes the current browser session and clears its session cookie."
      operationId: logout
      tags: [Auth]
      security:
        - cookieSession: []
      x-tenant-scope: identity
      x-permissions: []
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      responses:
        '204':
          description: Session destroyed and browser cookie cleared
          headers:
            Set-Cookie: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /api/v1/auth/me:
    get:
      description: "Returns the authenticated principal and tenant memberships."
      operationId: getMe
      tags: [Auth]
      security:
        - cookieSession: []
      x-tenant-scope: identity
      x-permissions: []
      x-milestone: M0
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/auth/me/preferences:
    get:
      description: "Returns the selected my preferences within the authorized request scope."
      operationId: getMyPreferences
      tags: [Auth]
      x-tenant-scope: identity
      x-permissions: []
      x-milestone: M1
      responses:
        '200': {$ref: '#/components/responses/UserPreferences'}
    patch:
      description: "Updates the selected my preferences within the authorized request scope."
      operationId: updateMyPreferences
      tags: [Auth]
      x-tenant-scope: identity
      x-permissions: []
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M1
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/UserPreferencesPatch'}
      responses:
        '200': {$ref: '#/components/responses/UserPreferences'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/admin/users:
    get:
      description: "Returns the requested page of users within the authorized request scope."
      operationId: listUsers
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:user:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/Query'}]
      responses:
        '200': {$ref: '#/components/responses/UserPage'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      description: "Creates user within the authorized request scope."
      operationId: createUser
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:user:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      requestBody: {$ref: '#/components/requestBodies/UserCreate'}
      responses:
        '201': {$ref: '#/components/responses/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Duplicate'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/users/{userId}:
    patch:
      description: "Updates the selected user within the authorized request scope."
      operationId: updateUser
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:user:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/UserPatch'}
      responses:
        '200': {$ref: '#/components/responses/User'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/admin/tenants:
    get:
      description: "Returns the requested page of tenants within the authorized request scope."
      operationId: listTenants
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:tenant:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/TenantPage'}
    post:
      description: "Creates tenant within the authorized request scope."
      operationId: createTenant
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:tenant:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      requestBody: {$ref: '#/components/requestBodies/TenantCreate'}
      responses:
        '201': {$ref: '#/components/responses/Tenant'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Duplicate'}
  /api/v1/admin/tenants/{tenantSlug}:
    patch:
      description: "Updates the selected tenant within the authorized request scope."
      operationId: updateTenant
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:tenant:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/TenantPatch'}
      responses:
        '200': {$ref: '#/components/responses/Tenant'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      description: "Deletes the selected tenant within the authorized request scope."
      operationId: deleteTenant
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:tenant:delete]
      x-milestone: M5
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/TenantDelete'}
      responses:
        '202': {$ref: '#/components/responses/TenantDeletionAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/admin/tenants/{tenantSlug}/members/{userId}:
    put:
      description: "Creates or replaces the selected tenant member as platform admin within the authorized request scope."
      operationId: putTenantMemberAsPlatformAdmin
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:tenant:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/UserId'}]
      requestBody: {$ref: '#/components/requestBodies/MemberPut'}
      responses:
        '200': {$ref: '#/components/responses/Member'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/settings:
    get:
      description: "Returns the selected platform settings within the authorized request scope."
      operationId: getPlatformSettings
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:settings:manage]
      x-milestone: M0
      responses:
        '200': {$ref: '#/components/responses/PlatformSettings'}
    patch:
      description: "Updates the selected platform settings within the authorized request scope."
      operationId: updatePlatformSettings
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:settings:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/PlatformSettingsPatch'}
      responses:
        '200': {$ref: '#/components/responses/PlatformSettings'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}

  /api/v1/admin/global-credentials:
    get:
      description: "Returns the requested page of global credentials within the authorized request scope."
      operationId: listGlobalCredentials
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:credential:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/GlobalCredentialPage'}
    post:
      description: "Creates global credential within the authorized request scope."
      operationId: createGlobalCredential
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:credential:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      requestBody: {$ref: '#/components/requestBodies/GlobalCredentialCreate'}
      responses:
        '201': {$ref: '#/components/responses/GlobalCredential'}
        '409': {$ref: '#/components/responses/Duplicate'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/global-credentials/{credentialId}:
    patch:
      description: "Updates the selected global credential within the authorized request scope."
      operationId: updateGlobalCredential
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:credential:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/CredentialId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/GlobalCredentialPatch'}
      responses:
        '200': {$ref: '#/components/responses/GlobalCredential'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      description: "Deletes the selected global credential within the authorized request scope."
      operationId: deleteGlobalCredential
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:credential:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/CredentialId'}, {$ref: '#/components/parameters/Force'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204': {description: Global credential deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CredentialInUse'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/admin/global-credentials/{credentialId}:test:
    post:
      description: "Tests global credential within the authorized request scope."
      operationId: testGlobalCredential
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:credential:manage]
      x-idempotency: {mode: none}
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/CredentialId'}]
      requestBody: {$ref: '#/components/requestBodies/ConnectionTest'}
      responses:
        '200': {$ref: '#/components/responses/ConnectionTest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/admin/global-credentials/{credentialId}:rotate:
    post:
      description: "Performs the rotate global credential workflow within the authorized request scope."
      operationId: rotateGlobalCredential
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:credential:manage]
      x-idempotency: {mode: required, ttlHours: 24}
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/CredentialId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CredentialRotate'}
      responses:
        '200': {$ref: '#/components/responses/GlobalCredentialRotation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /api/v1/admin/producer-profiles:
    get:
      description: "Returns the requested page of producer profiles within the authorized request scope."
      operationId: listProducerProfiles
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:producer:manage]
      x-milestone: M1
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/ProducerProfilePage'}
    post:
      description: "Creates producer profile within the authorized request scope."
      operationId: createProducerProfile
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:producer:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M1
      requestBody: {$ref: '#/components/requestBodies/ProducerProfileCreate'}
      responses:
        '201': {$ref: '#/components/responses/ProducerProfile'}
        '409': {$ref: '#/components/responses/Duplicate'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/admin/producer-profiles/{producerProfileId}:
    get:
      description: "Returns the selected producer profile within the authorized request scope."
      operationId: getProducerProfile
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:producer:manage]
      x-milestone: M1
      parameters: [{$ref: '#/components/parameters/ProducerProfileId'}]
      responses:
        '200': {$ref: '#/components/responses/ProducerProfile'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      description: "Updates the selected producer profile within the authorized request scope."
      operationId: updateProducerProfile
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:producer:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M1
      parameters: [{$ref: '#/components/parameters/ProducerProfileId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ProducerProfilePatch'}
      responses:
        '200': {$ref: '#/components/responses/ProducerProfile'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      description: "Deletes the selected producer profile within the authorized request scope."
      operationId: deleteProducerProfile
      tags: [Platform]
      x-tenant-scope: platform
      x-permissions: [platform:producer:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M1
      parameters: [{$ref: '#/components/parameters/ProducerProfileId'}, {$ref: '#/components/parameters/Force'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204': {description: Producer profile deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidState'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}

  /api/v1/t/{tenantSlug}/settings:
    get:
      description: "Returns the selected tenant settings within the authorized request scope."
      operationId: getTenantSettings
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [tenant:settings:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}]
      responses:
        '200': {$ref: '#/components/responses/TenantSettings'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      description: "Updates the selected tenant settings within the authorized request scope."
      operationId: updateTenantSettings
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [tenant:settings:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/TenantSettingsPatch'}
      responses:
        '200': {$ref: '#/components/responses/TenantSettings'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/t/{tenantSlug}/producer-profiles:
    get:
      description: "Returns the requested page of available producer profiles within the authorized request scope."
      operationId: listAvailableProducerProfiles
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [service:write]
      x-milestone: M1
      parameters: [{$ref: '#/components/parameters/TenantSlug'}]
      responses:
        '200': {$ref: '#/components/responses/ProducerProfileOptionList'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/t/{tenantSlug}/directory/users:
    get:
      description: "Searches for tenant users within the authorized request scope."
      operationId: searchTenantUsers
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [tenant:member:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/Query'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/UserPage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/t/{tenantSlug}/members:
    get:
      description: "Returns the requested page of tenant members within the authorized request scope."
      operationId: listTenantMembers
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [tenant:member:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/MemberPage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/t/{tenantSlug}/members/{userId}:
    put:
      description: "Creates or replaces the selected tenant member within the authorized request scope."
      operationId: putTenantMember
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [tenant:member:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/UserId'}]
      requestBody: {$ref: '#/components/requestBodies/MemberPut'}
      responses:
        '200': {$ref: '#/components/responses/Member'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/LastAdmin'}
    delete:
      description: "Deletes the selected tenant member within the authorized request scope."
      operationId: deleteTenantMember
      x-idempotency: {mode: optional, ttlHours: 24}
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [tenant:member:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Member removed}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/LastAdmin'}
  /api/v1/t/{tenantSlug}/tokens:
    get:
      description: "Returns the requested page of tokens within the authorized request scope."
      operationId: listTokens
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [token:manage]
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/TokenPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      description: "Creates token within the authorized request scope."
      operationId: createToken
      tags: [Tenant]
      x-tenant-scope: tenant
      x-permissions: [token:manage]
      x-idempotency: {mode: optional, ttlHours: 24}
      x-milestone: M0
      parameters: [{$ref: '#/components/parameters/TenantSlug'}]
      requestBody: {$ref: '#/components/requestBodies/TokenCreate'}
      responses:
        '201': {$ref: '#/components/responses/TokenCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/t/{tenantSlug}/tokens/{tokenId}:
