  schemas:
    Uuid: {type: string, format: uuid, description: UUID v7}
    ETag: {type: string, pattern: '^(W/)?"[^"]+"$', minLength: 3, maxLength: 128, description: Opaque HTTP entity tag including quotes}
    Timestamp: {type: string, format: date-time, description: RFC 3339 UTC}
    Slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$'}
    AssetName: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$'}
    AssetNameTemplate: {type: string, maxLength: 128, pattern: '^(?:[a-z0-9-]|\{file_stem\}|\{parent_dir\})+$'}
    KindId: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
    GitRemoteUrl: {type: string, minLength: 1, maxLength: 2048, format: git-remote-url, description: 'HTTPS URL, ssh:// URL, or SCP-like user@host:path'}
    RefName: {type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/-]+$', format: git-ref-name}
    RefGlob: {type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9._/*?-]+$', format: git-ref-glob}
    RefType: {type: string, enum: [branch, tag], default: branch}
    Lifecycle: {type: string, enum: [draft, published, deprecated, retired]}
    ServiceVisibility: {type: string, enum: [private, internal, public]}
    ExternalRevisionTrustMode: {type: string, enum: [review_required, trust_ai, trust_ai_and_third_party]}
    TenantStatus: {type: string, enum: [active, disabled]}
    TenantRole: {type: string, enum: [tenant_admin, maintainer, viewer]}
    ServiceRole: {type: string, enum: [owner, maintainer, viewer]}
    LayerRole: {type: string, enum: [base, overlay]}
    LayerOrigin: {type: string, enum: [repo, third_party, manual, ai_generated]}
    SourceMode: {type: string, enum: [builtin, command, push, manual, ai]}
    ConfigSource: {type: string, enum: [db_manual, repo_file, repo_bootstrap]}
    RevisionStatus: {type: string, enum: [not_required, pending_review, approved, rejected, superseded]}
    JobStatus: {type: string, enum: [pending, running, succeeded, succeeded_with_warnings, failed, outcome_unknown, cancelled]}
    JobTrigger: {type: string, enum: [manual, schedule, webhook, api, cli, system, retry]}
    JobType: {type: string, enum: [tenant.delete, repo.sync, repo.discover, asset.produce, asset.merge, asset.index, asset.ai_generate, asset.reindex, diff.run, outbox.dispatch, workspace.gc, blob.gc, retention.cleanup]}
    JobScopeType: {type: string, enum: [tenant, repository, service, source, track, version, asset, diff, system]}
    PipelineStage: {type: string, enum: [resolve, discover, extract, merge, normalize, index]}
    TodoStatus: {type: string, enum: [open, acked]}
    DiffLevel: {type: string, enum: [breaking, risky, non_breaking, informational]}
    ContentType: {type: string, enum: [yaml, json]}
    OverlayDialect: {type: string, enum: [none, oas-overlay-1.0, platform-v1]}
    CapabilityList: {type: array, uniqueItems: true, items: {type: string}}
    PageInfo:
      type: object
      required: [total, page, pageSize]
      properties:
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
    ErrorCode:
      type: string
      enum: [unauthenticated, csrf_invalid, not_found, validation_error, asset_path_not_found, overlay_invalid, input_spec_mismatch, branch_not_indexed, upload_expired, nesting_too_deep, producer_profile_unavailable, unsupported_kind, duplicate, version_not_publishable, base_layer_exists, quota_exceeded, last_admin, credential_in_use, invalid_state, idempotency_conflict, job_not_cancellable, config_import_conflict, ai_disabled, kind_disabled, content_too_large, rate_limited, precondition_failed, internal_error]
    FieldError:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path: {type: string}
        message: {type: string}
        rule: {type: [string, 'null']}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string}
        details: {type: [object, 'null'], additionalProperties: true}
        requestId: {type: string, minLength: 1}
      x-details-by-code:
        validation_error: {fields: 'FieldError[]', unknownFields: 'string[]'}
        asset_path_not_found: {candidates: '[{path,reason}]'}
        overlay_invalid: {errors: '[{line,column,message}]', coordinates: 1-based}
        version_not_publishable: {blockingRevisions: '[{revisionId,layerId,status}]'}
        quota_exceeded: {quota: string, current: integer, limit: integer}
        rate_limited: {retryAfterSec: integer}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {type: string, enum: [ok]}}
    VersionInfo:
      type: object
      additionalProperties: false
      required: [serverVersion, apiVersion, contractVersion, buildCommit]
      properties:
        serverVersion: {type: string}
        apiVersion: {type: string, const: v1}
        contractVersion: {type: string, const: 1.0.0}
        buildCommit: {type: string}
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties: {csrfToken: {type: string, minLength: 32}}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    LoginResult:
      type: object
      additionalProperties: false
      required: [me, csrfToken]
      properties:
        me: {$ref: '#/components/schemas/Me'}
        csrfToken: {type: string, minLength: 32}
    User:
      type: object
      additionalProperties: false
      required: [id, etag, username, displayName, email, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        etag: {$ref: '#/components/schemas/ETag'}
        username: {type: string, minLength: 1, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 128}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    TenantMembershipRef:
      type: object
