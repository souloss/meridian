      operationId: resolveView
      description: Resolves view within the authorized request scope.
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewResolution'
        '404':
          description: The server cannot find the requested resource.
          headers:
            X-Request-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Client error
          headers:
            X-Request-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - View
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewResolveRequest'
      x-milestone: M1
      x-idempotency:
        mode: none
      x-permissions:
      - asset:read
      x-tenant-scope: tenant
  /api/v1/version:
    get:
      operationId: getVersion
      description: Returns the server build, API, and contract versions.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
      tags:
      - System
      security: []
      x-milestone: M0
      x-permissions: []
      x-tenant-scope: public
  /api/v1/webhooks/git/{repositoryId}:
    post:
      operationId: receiveGitWebhook
      description: Performs the receive git webhook workflow within the authorized request scope.
      parameters:
      - $ref: '#/components/parameters/RepositoryId'
      - $ref: '#/components/parameters/WebhookDelivery'
      - $ref: '#/components/parameters/WebhookEvent'
      - $ref: '#/components/parameters/WebhookSignature'
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          description: Access is unauthorized.
          headers:
            X-Request-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The server cannot find the requested resource.
          headers:
            X-Request-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitPushWebhook'
      security: []
      x-milestone: M1
      x-idempotency:
        mode: provider-delivery-id
        ttlHours: 24
      x-permissions: []
      x-tenant-scope: signed-webhook
  /healthz:
    get:
      operationId: healthz
      description: Reports whether the Meridian process is alive.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
      - System
      security: []
      x-milestone: M0
      x-permissions: []
      x-tenant-scope: public
  /metrics:
    get:
      operationId: metrics
      description: Returns deployment metrics in Prometheus text exposition format.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/plain:
              schema:
                type: string
      tags:
      - System
      security: []
      x-milestone: M5
      x-permissions: []
      x-tenant-scope: deployment-private
  /readyz:
    get:
      operationId: readyz
      description: Reports whether Meridian dependencies are ready to serve traffic.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service unavailable.
          headers:
            X-Request-Id:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - System
      security: []
      x-milestone: M0
      x-permissions: []
      x-tenant-scope: public
security:
- cookieSession: []
- patBearer: []
components:
