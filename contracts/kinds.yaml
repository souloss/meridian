schemaVersion: 1
contractId: meridian-asset-kinds-v1
status: frozen
pluginInterface:
  version: 1
  goPackage: internal/kinds
  methods:
    validator:
      signature: 'Validate(ctx context.Context, input Document) (ValidatedDocument, ValidationReport, error)'
    normalizer:
      signature: 'Normalize(ctx context.Context, input ValidatedDocument) (CanonicalDocument, ArtifactSet, error)'
    extractor:
      signature: 'Extract(ctx context.Context, input CanonicalDocument, provenance ProvenanceMap) ([]Item, error)'
    differ:
      signature: 'Diff(ctx context.Context, left CanonicalDocument, right CanonicalDocument, rules RuleSet) (DiffResult, error)'
    overlayCompiler:
      signature: 'CompileOverlay(ctx context.Context, dialect string, content []byte) ([]overlay.Action, error)'
  deterministicInputs:
    - content-bytes
    - plugin-version
    - rule-set-version
  forbiddenInputs: [clock, random, mutable-environment]

registry:
  - id: openapi
    milestone: M1
    schemaVersion: 1
    acceptedMediaTypes: [application/yaml, application/json]
    acceptedVersions: [swagger-2.0, openapi-3.0, openapi-3.1]
    canonicalVersion: openapi-3.1
    itemTypes: [operation]
    itemKey: '${upper(method)} ${normalizedPath}'
    overlayDialects: [oas-overlay-1.0, platform-v1]
    defaultViews: [swagger-ui, redoc, source, layers, operations, items-table, diff]
    capabilities: [validate, normalize, extract, structured_diff, breaking_rules, overlay]
    pluginVersion: 1
  - id: asyncapi
    milestone: M5
    schemaVersion: 1
    acceptedMediaTypes: [application/yaml, application/json]
    acceptedVersions: [asyncapi-2, asyncapi-3]
    canonicalVersion: asyncapi-3
    itemTypes: [channel, message]
    itemKey: '${itemType}:${qualifiedName}'
    overlayDialects: [platform-v1]
    defaultViews: [source, layers, items-table, diff]
    capabilities: [validate, normalize, extract, generic_diff, overlay]
    pluginVersion: 1
  - id: dbschema
    milestone: M4
    schemaVersion: 1
    acceptedMediaTypes: [application/json, application/yaml]
    canonicalVersion: meridian-dbschema-1
    itemTypes: [table, column]
    itemKey: '${tableName}${columnName == null ? "" : "." + columnName}'
    overlayDialects: [platform-v1]
    defaultViews: [source, layers, items-table, diff]
    capabilities: [validate, extract, generic_diff, breaking_rules, overlay]
    pluginVersion: 1
  - id: dependency
    milestone: M4
    schemaVersion: 1
    acceptedMediaTypes: [application/json, application/yaml]
    canonicalVersion: meridian-dependency-1
    itemTypes: [edge]
    itemKey: '${from}->${to}:${protocol}:${name}'
    overlayDialects: [platform-v1]
    defaultViews: [source, layers, items-table, diff, dep-graph]
    capabilities: [validate, extract, generic_diff, overlay]
    pluginVersion: 1

contentSchemas:
  dbschema:
    type: object
    additionalProperties: false
    required: [schemaVersion, database, tables]
    properties:
      schemaVersion: {const: meridian-dbschema-1}
      database:
        type: object
        additionalProperties: false
        required: [name, engine]
        properties:
          name: {type: string, minLength: 1}
          engine: {type: string, enum: [postgresql, mysql, mariadb, sqlite, other]}
          version: {type: [string, 'null']}
      tables:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, columns, indexes, foreignKeys]
          properties:
            name: {type: string, minLength: 1}
            description: {type: [string, 'null']}
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, dataType, nullable]
                properties:
                  name: {type: string, minLength: 1}
                  dataType: {type: string, minLength: 1}
                  nullable: {type: boolean}
                  default: {}
                  description: {type: [string, 'null']}
            indexes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, columns, unique]
                properties:
                  name: {type: string}
                  columns: {type: array, minItems: 1, items: {type: string}}
                  unique: {type: boolean}
            foreignKeys:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, columns, referenceTable, referenceColumns]
                properties:
                  name: {type: string}
                  columns: {type: array, minItems: 1, items: {type: string}}
                  referenceTable: {type: string}
                  referenceColumns: {type: array, minItems: 1, items: {type: string}}
  dependency:
    type: object
    additionalProperties: false
    required: [schemaVersion, edges]
    properties:
      schemaVersion: {const: meridian-dependency-1}
      edges:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [from, protocol]
          oneOf:
            - required: [toServiceSlug]
            - required: [external]
          properties:
            name: {type: string, default: default}
            from: {type: string, description: source-service-slug}
            toServiceSlug: {type: string}
            external: {type: string}
            protocol: {type: string, enum: [http, grpc, event, database, cache, queue, other]}
            middleware: {type: [string, 'null']}
            description: {type: [string, 'null']}
            metadata: {type: object, additionalProperties: true}

itemSchemas:
  openapi.operation:
    required: [method, path, summary, tags, deprecated]
  asyncapi.channel:
    required: [name, address, operations]
  asyncapi.message:
    required: [name, contentType, channel]
  dbschema.table:
    required: [name, description, columnCount]
  dbschema.column:
    required: [table, name, dataType, nullable, description]
  dependency.edge:
    required: [fromServiceId, toServiceId, external, protocol, middleware]

breakingRules:
  openapi-v1:
    breaking:
      - operation-removed
      - required-request-parameter-added
      - required-request-field-added
      - request-constraint-tightened
      - response-field-removed
      - scalar-type-narrowed
      - response-status-removed
      - authentication-tightened
      - media-type-removed
  dbschema-v1:
    breaking:
      - table-removed
      - column-removed
      - column-type-narrowed
      - nullable-changed-true-to-false-without-default

platformOverlaySchema:
  type: object
  additionalProperties: false
  required: [overlay, target_kind, actions]
  properties:
    overlay: {const: platform/v1}
    target_kind: {type: string}
    mode: {type: string, enum: [lenient, strict], default: lenient}
    actions:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        oneOf:
          - required: [target, merge]
            not: {anyOf: [{required: [remove]}, {required: [patch]}]}
          - required: [target, remove]
            not: {anyOf: [{required: [merge]}, {required: [patch]}]}
          - required: [patch]
            not: {anyOf: [{required: [target]}, {required: [merge]}, {required: [remove]}]}
        properties:
          target: {type: string}
          merge: {}
          remove: {const: true}
          patch:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [op, path]
              allOf:
                - if: {properties: {op: {enum: [add, replace, test]}}, required: [op]}
                  then: {required: [value]}
                - if: {properties: {op: {enum: [move, copy]}}, required: [op]}
                  then: {required: [from]}
                - if: {properties: {op: {enum: [remove]}}, required: [op]}
                  then: {not: {anyOf: [{required: [from]}, {required: [value]}]}}
              properties:
                op: {type: string, enum: [add, remove, replace, move, copy, test]}
                path: {type: string, pattern: '^(?:/(?:[^~/]|~0|~1)*)*$'}
                from: {type: string, pattern: '^(?:/(?:[^~/]|~0|~1)*)*$'}
                value: {}
  x-invariants:
    - target-and-patch-paths-are-evaluated-against-the-current-document-after-prior-actions
    - merge-uses-rfc7386-null-deletes-object-member
    - patch-uses-rfc6902-array-index-and-dash-append-semantics
    - duplicate-object-keys-are-rejected-before-validation
    - action-order-is-document-order
