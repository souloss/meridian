schemaVersion: 1
contractId: meridian-work-items-v1
status: active
authority: >-
  This file is the machine-readable queue for autonomous implementation. It
  references, but never redefines, operationIds, stories, assertions, and
  domain rules owned by the other contracts.

selection:
  order: [milestone, dependency-ready, priority, id]
  onlyStatuses: [ready, in_progress, needs_retry]
  oneActiveItemPerWorkspace: true
  neverSkipFailedGate: true
  requireCleanCheckpointBeforeClaim: true

statuses:
  - planned
  - ready
  - claimed
  - in_progress
  - verifying
  - passed
  - needs_human_acceptance
  - accepted
  - failed
  - needs_retry
  - blocked
  - superseded
  - cancelled

evidence:
  requiredFields: [itemId, commit, baseCommit, contractDigest, command, exitCode, startedAt, reportPath, result]
  resultValues: [pass, fail, stale]
  staleWhen: contract-or-source-tree-changes-after-command

defaults:
  owner: coding-agent
  maxAttempts: 3
  leaseMinutes: 30
  evidenceRoot: artifacts/agent

