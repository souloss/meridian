schemaVersion: 1
contractId: meridian-work-items-v1
status: active
authority: >-
  This file is the machine-readable queue for autonomous implementation. It
  references, but never redefines, operationIds, stories, assertions, and
  domain rules owned by the other contracts.

selection:
  order: [milestone, dependency-ready, priority, id]
  onlyStatuses: [ready, needs_retry]
  oneActiveItemPerWorkspace: true
  neverSkipFailedGate: true
  requireCleanCheckpointBeforeClaim: true
  requirePreviousMilestoneAccepted: true
  sameMilestoneDependencyStatus: passed
  crossMilestoneDependencyStatus: passed-with-milestone-accepted

statuses:
  - planned
  - ready
  - claimed
  - in_progress
  - verifying
  - passed
  - needs_human_acceptance
  - accepted
  - failed
  - needs_retry
  - blocked
  - superseded
  - cancelled

legacyWorkItemStatuses: [needs_human_acceptance, accepted]

evidence:
  requiredFields: [workItem, status, commit, baseCommit, contractDigest, startedAt, reportPath, commands]
  statusValues: [passed, failed, needs_retry, blocked, stale]
  commandRequiredFields: [command, exitCode, durationSeconds, stdoutPath, stderrPath]
  assertionStatusValues: [passed, failed, not_run, stale]
  staleWhen: contract-or-source-tree-changes-after-command

verification:
  verifyFormat: make-target-name-array
  commandTemplate: make <target> ITEM=<work-item-id>
  preflightTemplate: make -n <target> ITEM=<work-item-id>
  missingRepositoryTargetOrFixture: tooling_gap-owned-by-current-item
  neverWeakenOrSubstituteDeclaredAssertions: true

retryPolicy:
  requireChangedCodeToolingEnvironmentOrNewDiagnosticBeforeRetry: true
  noUnchangedRepeatedFailure: true
  exhaustedStatus: failed
  failureKindRequiredFor: [needs_retry, failed, blocked]
  failureKinds: [code_failure, tooling_gap, contract_failure, environment_failure, flaky_failure, product_decision]
  resetRequires: explicit-user-authorization-with-preserved-history

milestoneGatePolicy:
  statuses: [pending, needs_human_acceptance, accepted, changes_requested]
  allMilestoneItemsMustPassBeforeReport: true
  acceptedRequires: [acceptedBy, acceptedAt, reportPath, acceptedCommit, contractDigest]
  changesRequestedCreatesRepairItems: true
  nextMilestoneRequiresPreviousAccepted: true

milestoneGates:
  M0: {status: pending, reportPath: null, acceptedBy: null, acceptedAt: null, acceptedCommit: null, contractDigest: null}
  M1: {status: pending, reportPath: null, acceptedBy: null, acceptedAt: null, acceptedCommit: null, contractDigest: null}
  M2: {status: pending, reportPath: null, acceptedBy: null, acceptedAt: null, acceptedCommit: null, contractDigest: null}
  M3: {status: pending, reportPath: null, acceptedBy: null, acceptedAt: null, acceptedCommit: null, contractDigest: null}
  M4: {status: pending, reportPath: null, acceptedBy: null, acceptedAt: null, acceptedCommit: null, contractDigest: null}
  M5: {status: pending, reportPath: null, acceptedBy: null, acceptedAt: null, acceptedCommit: null, contractDigest: null}

defaults:
  owner: coding-agent
  maxAttempts: 3
  leaseMinutes: 30
  evidenceRoot: artifacts/agent

