          - create-one-layer-linked-to-source-spec-and-binding
          - return-initial-layer-id
        responseInitialLayerId: required
        noAsyncMaterialization: true
    jobInput: resolve-ref-and-commit-once-at-enqueue-and-persist-them
    stableKey: [sourceSpecId, scopeType, scopeKey, expansionKey]
    exactRefScope: {scopeType: ref, scopeKey: '<refType>:<refName>'}
    globalScope: {scopeType: global, scopeKey: '*'}
    expansionKeyForRepositoryArtifact: normalized-repository-relative-path
    expansionKeyForProducerArtifact: normalized-completion-manifest-relative-path
    atomicCommit: upsert-all-bindings-for-the-resolved-scope-then-mark-only-unseen-bindings-in-that-scope-stale
    bindingsCountProjection: count-active-bindings-across-all-scopes
    defaultNameTemplate: '{file_stem}'
    omittedNameTemplateBehavior: use-default-name-template
    allowedNameTemplateTokens: ['{file_stem}', '{parent_dir}']
    renderedNameNormalization:
