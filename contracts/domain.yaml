    - scope_type
    - scope_key
    - expansion_key
    - resolved_path
    - asset_id
    - layer_id
  expansion:
    triggerOperations: [syncRepository, produceSource]
    createSourceSpecBehavior:
      nonManual: persist-configuration-only-and-return-bindings-count-zero
