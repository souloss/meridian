schemaVersion: 1
contractId: meridian-domain-v1
status: frozen
authority:
  businessRequirements: ../01_requirement-specification.md
  acceptance: ../04_user-story-smoke-test-plan.md
  transportAndDtos: ./openapi.yaml
  builtInViews: ./views.yaml
  ownership: domain-enum-state-permission-default-limit-and-behavior
  rule: >-
    Generated code and tests MUST fail when this semantic source disagrees with a
    wire or storage projection. Narrative text may explain it but cannot override it.

releaseScope:
  mvp: [M0, M1, M2, M3]
  v1Ga: [M0, M1, M2, M3, M4, M5]
  excludedFromV1:
    - config-asset-kind
    - deployment-asset-kind
    - markdown-doc-asset-kind
    - erd-view
    - rapidoc-view
    - mock-view
    - embed-snippet-view
    - grpc-asset-kind-plugins
    - sdk-generation
    - ci-result-callback
    - layer-aware-diff-grouping

wire:
  jsonNaming: camelCase
  enumNaming: snake_case
  idFormat: uuid-v7
  timestampFormat: RFC3339-UTC
  unknownRequestFields: reject
  customFormats:
    git-remote-url: https-or-ssh-uri-or-scp-like-user-at-host-colon-path-no-password-component
    git-ref-name: git-check-ref-format-compatible-subset-no-wildcards-no-leading-or-trailing-slash-no-dotdot-no-double-slash-no-at-brace-no-lock-suffix
    git-ref-glob: git-ref-name-components-plus-star-double-star-and-question-no-negation
    repository-relative-path: normalized-slash-path-no-leading-slash-no-dotdot-no-nul
    repository-service-root: exact-dot-sentinel-or-repository-relative-path-with-no-dot-segments
    repository-relative-glob: repository-relative-path-plus-star-double-star-question-and-brace-alternation
    gitignore-pattern: gitignore-syntax-relative-to-service-root
    cron-5-field: robfig-cron-v3-parser-with-minute-hour-day-of-month-month-day-of-week-and-no-descriptors-or-seconds
    repository-url: normalize-scheme-host-port-path-and-strip-credentials-before-uniqueness
  pagination:
    pageDefault: 1
    pageSizeDefault: 20
    pageSizeMax: 100
    outOfRangePageSize: clamp
    sortQuery: sort
    sortSyntax: field-for-ascending-minus-field-for-descending
  limits:
    manualOrPushRevisionBytes: 1048576
    producerArtifactBytes: 10485760
    previewOverrideBytes: 1048576
    uploadBytes: 10485760
    shareExpiresMinSeconds: 300
    shareExpiresMaxSeconds: 2592000
    aiHintChars: 500
    reviewCommentChars: 2000
    todoCommentChars: 2000
  rateLimits:
    loginPerMinutePerIp: 10
    authenticatedReadsPerMinutePerSubject: 600
    authenticatedWritesPerMinutePerSubject: 60
  idempotency:
    header: Idempotency-Key
    format: uuid
    retentionHours: 24
    requiredCategories:
      - asset-push
      - repository-sync
      - repository-discover
      - ai-generation
      - revision-submit
      - version-publish
      - revision-review
    requiredOperationIds:
      - rotateGlobalCredential
      - rotateCredential
      - syncRepository
      - discoverRepository
      - acceptDiscoveryCandidates
      - previewRepositoryConfigImport
      - applyRepositoryConfigImport
      - rotateNotificationChannelSecret
      - resolveServiceDrift
      - produceSource
      - generateMissingAssetWithAi
      - publishAssetVersion
      - deprecateAssetVersion
      - retireAssetVersion
      - generateAssetWithAi
      - pushAssetRevision
      - createLayerRevision
      - rollbackLayer
      - approveLayerRevision
      - rejectLayerRevision
      - retryJob
      - createTenantExport
    requiredOperationRule: every-listed-operation-declares-x-idempotency-mode-required-and-accepts-uuid-idempotency-key
    optionalModeBehavior: when-header-is-present-use-the-identical-record-digest-lock-and-replay-protocol; when-omitted-run-once-without-a-record
    replay: return-original-status-and-JSON-body-value; emit-a-new-request-id-and-reconstruct-ETag-from-body-etag-when-present
    persistenceByOperationScope:
      tenant: idempotency_records
      identityOrPlatform: global_idempotency_records
    replayIdentity:
      tenant: [tenantId, principalType, principalId, operationId, idempotencyKey]
      identityOrPlatform: [contextType, principalType, principalId, operationId, idempotencyKey]
    requestDigest:
      algorithm: SHA-256
      canonicalization: RFC8785-JCS
      canonicalObject:
        operationId: exact-openapi-operation-id
        pathParameters: router-decoded-and-schema-normalized-object-with-keys-sorted-by-JCS
        query: percent-decoded-list-of-name-value-pairs-sorted-by-name-then-value-with-duplicates-preserved
        semanticHeaders: lower-case-map-containing-if-match-when-present
        body: parsed-json-value-or-null-when-no-body
      excludedHeaders: [authorization, cookie, x-csrf-token, x-request-id, idempotency-key, content-length]
      storageEncoding: 32-raw-bytes-in-request_hash-bytea
      diagnosticEncoding: lowercase-hex
    concurrentFirstRequest:
      lock: PostgreSQL-transaction-advisory-lock-derived-from-replay-identity
      sideEffectsAndCompletedResponse: one-database-transaction
      maximumHandlerTransactionSeconds: 30
      sameHashLoser: wait-for-winner-then-replay-exact-status-and-body
      differentHashLoser: wait-for-winner-then-return-409-idempotency_conflict
      winnerRollbackOrDisconnectBeforeCommit: waiter-acquires-lock-and-becomes-winner
      longRunningWork: enqueue-only-inside-handler-transaction-and-execute-after-commit
    requestHashMismatch: 409-idempotency_conflict

optimisticConcurrency:
  token: opaque-http-etag-including-quotes
  bodyField: etag
  responseHeader: ETag
  requestHeader: If-Match
  rules:
    - every-response-body-for-an-if-match-protected-resource-includes-etag
    - collection-items-carry-their-own-resource-etag
    - response-etag-header-equals-body-etag
    - clients-echo-the-token-byte-for-byte-and-never-derive-it-from-updatedAt-or-revision
    - a-stale-or-missing-token-on-a-protected-operation-returns-412-precondition_failed
  resourceTokenSource:
    platformSettings: platform_settings.revision
    userPreferences: user_preferences.revision
    assetKind: tenant_kind_overrides.revision
    assetVersion: asset_versions.revision
    aggregateCollections: parent-resource-revision
  rowExistence:
    - platform-settings-singleton-is-seeded-by-migration
    - user-preferences-is-created-with-the-user
    - tenant-kind-overrides-are-created-for-every-tenant-kind-pair

platformDefaults:
  semantics: copy-on-tenant-create-not-live-inheritance
  copiedAtomically:
    - defaultQuota-to-tenant-quota
    - defaultTenantSettings-to-tenant-settings
    - defaultViewOverrides-to-tenant-view-overrides
    - defaultNotificationChannels-to-tenant-notification-channels
  existingTenantEffect: none
  notificationTemplateRestriction: in_app-only-with-no-endpoint-or-secret
  tenantWebhookAndEmailConfiguration: tenant-notification-channel-api-with-encrypted-config

repository:
  remoteUrl:
    canonicalization:
      - lowercase-scheme-and-host
      - remove-default-https-or-ssh-port
      - remove-trailing-slash
      - preserve-path-case
      - reject-userinfo-password-and-fragment
    uniqueness: [tenant_id, canonical_url, default_branch]
  workspace:
    rootConfiguration: MERIDIAN_WORKSPACE_ROOT
    rootRequirement: absolute-path-on-persistent-or-rebuildable-volume
    checkoutLayout: '{root}/{tenantId}/{repositoryId}/{jobId}'
    cleanup: remove-after-job-unless-retained-for-failure-diagnostics
  discovery:
    markerFiles: [go.mod, pom.xml, build.gradle, build.gradle.kts, package.json, pyproject.toml, Cargo.toml]
    markerDirectories: [proto]
    candidateKey: [repositoryId, commit, rootDir]
    rootNormalization: repository-relative-path-with-empty-root-allowed
    serviceCreatePathMapping: null-or-omitted-request-path-is-stored-as-empty-root-dir
    ordering: rootDir-ascending-bytewise
    repeatedCandidateBehavior: update-existing-candidate-and-reset-status-to-pending-only-if-commit-changed
  recentServices:
    table: recent_services
    readOperation: listRecentServices
    ordering: viewed_at-descending-then-service-id-ascending
    retention: one-row-per-user-service-updated-on-successful-service-detail-read

authentication:
  password:
    algorithm: argon2id
    parameters: {memoryKiB: 65536, iterations: 3, parallelism: 1, saltBytes: 16, hashBytes: 32}
    storedFormat: PHC-string
    verification: constant-time-library-verifier
  tokenDigest:
    algorithm: hmac-sha256
    secretConfiguration: MERIDIAN_TOKEN_PEPPER
    secretEncoding: unpadded-base64url-of-exactly-32-random-bytes
    comparison: constant-time
    submittedTokenLogging: forbidden
  browser:
    cookieName: meridian_session
    tokenFormat: ses_-plus-base64url-32-random-bytes
    storage: hmac-digest-only
    httpOnly: true
    secureOutsideLocalDevelopment: true
    sameSite: Lax
    sessionTtlHours: 72
    csrf:
      header: X-CSRF-Token
      tokenFormat: base64url-32-random-bytes
      storage: hmac-digest-only
      deliveredBy:
        - login-response-field: csrfToken
        - endpoint: GET /api/v1/auth/csrf
      requiredFor: browser-non-safe-methods
  pat:
    header: Authorization
    scheme: Bearer
    tokenPrefix: pat_
    scope: tenant-only-in-v1
    platformBotTokens: excluded-from-v1
    platformOperations: authenticated-token-can-never-satisfy-platform-permissions-and-is-denied
    tokenFormat: pat_-plus-base64url-32-random-bytes
    randomSource: cryptographic-random
    storage: hmac-digest-only
    csrfRequired: false
    invalidOrExpiredHttpStatus: 401
  credentialPrecedence:
    rule: authorization-bearer-when-present-otherwise-browser-cookie
    invalidBearerFallbackToCookie: forbidden
  platformAdminTenantAccess: >-
    Platform administrator status grants platform metadata administration only.
    Tenant business data is available only when the same user is also an active
    member of that tenant, using that tenant membership's permissions.
  platformJobMetadata:
    allowed: [jobId, tenantSlug, type, trigger, status, stage, scopeType, scopeId, createdAt, startedAt, finishedAt]
    scopeIdRule: expose-only-for-tenant-or-repository-scope-otherwise-null
    forbiddenWithoutTenantMembership: [refName, input, result, attempts, errorMessage, logs, asset-or-version-identifiers]
  tenantDisabledBehavior:
    loginAllowed: true
    disabledTenantExcludedFromMe: true
    tenantBusinessAccess: not_found
  bootstrap:
    command: meridian admin create
    requiredArguments: [username]
    passwordInput: stdin-or-password-file
    behavior: create-or-promote-platform-admin

gitWebhook:
  providerContract: meridian-generic-push-v1
  scmProviderAdapters: outside-http-contract
  signature:
    header: X-Meridian-Signature-256
    algorithm: hmac-sha256
    signedBytes: raw-request-body
    comparison: constant-time
  deliveryIdHeader: X-Meridian-Delivery
  eventHeader: {name: X-Meridian-Event, value: push}
  deliveryDeduplicationHours: 24
  maximumBodyBytes: 1048576
  deletedRefBehavior: mark-track-inactive-and-preserve-history

knownHosts:
  keyIdentity:
    host: normalized-lowercase-dns-name-or-ip-without-brackets
    port: integer-1-to-65535-default-22
    keyType: SSH-public-key-algorithm-name-from-host-key
    publicKey: RFC4253-public-key-blob-in-OpenSSH-authorized-key-base64-form
    fingerprint: SHA256-base64-of-RFC4253-public-key-blob-with-SHA256-prefix
    supportedKeyTypes: [ssh-ed25519, ssh-rsa]
  manualCreate:
    acceptedInput: [host, port, publicKey]
    serverDerivation:
      - strict-base64-decode-public-key
      - parse-first-RFC4253-length-prefixed-string-as-key-type
      - require-key-type-in-supported-key-types
      - fully-parse-the-key-type-specific-RFC4253-structure-and-require-no-trailing-bytes
      - compute-SHA256-over-the-complete-decoded-RFC4253-blob
      - encode-fingerprint-as-SHA256-colon-standard-base64-without-padding
    clientSuppliedKeyTypeOrFingerprint: rejected-as-unknown-request-fields
    malformedOrUnsupportedPublicKey: 422-validation_error
    duplicateNaturalKey: 409-duplicate
  repositoryPolicy:
    field: fetchConfig.knownHostPolicy
    values: [strict, accept_new]
    default: strict
    strict: unknown-host-fails-with-host_key-and-returns-candidate
    accept_new: unknown-host-is-recorded-atomically-before-fetch-and-reused-afterward
  manualCreateSource: manual
  storedPublicKey: necessary-for-ssh-verification-not-returned-by-list-endpoint
  createdBy:
    manual: authenticated-user-id
    acceptNew: initiating-user-id-or-null-for-schedule-and-system-jobs

credentials:
  tenantListing: tenant-owned-readable-plus-all-global
  repositorySelector:
    field: credentialId
    nullMeaning: public-repository
    lookup: tenant-credential-first-then-global-credential
    collisionPolicy: uuid-identifiers-are-globally-unique
  globalCredentialOwnership: platform-admin-only
  globalRotationResponseMetadata:
    allowedWithoutTenantMembership: [tenantSlug, repositoryId, jobId, deduplicated]
    forbidden: [repositoryName, repositoryUrl, refName, jobInput, jobResult, jobLogs]
  secretReadback: forbidden
  generatedPatReadback: create-response-only
  forcedDelete:
    effect: atomically-set-referencing-repositories-credential-null
    followUp: mark-repositories-auth-required-and-enqueue-health-check
  rotation:
    credentialKindMustMatchExisting: true
    kindMismatch: 422-validation_error
    secretReadback: forbidden
    requiredHeaders: [If-Match, Idempotency-Key]
    resyncRepositories:
      requestField: resyncRepositories
      default: false
      omittedBehavior: exactly-false
      whenTrue: atomically-update-secret-then-enqueue-default-branch-sync-for-each-non-deleted-referencing-repository
      whenFalse: update-secret-without-enqueueing-sync
      enqueueTrigger: credential-rotated
      response: updated-credential-plus-one-credential-sync-job-per-non-deleted-referencing-repository
      responseJobFields: [tenantSlug, repositoryId, jobId, deduplicated]
      responseOrdering: tenant-slug-ascending-then-repository-id-ascending
      responseEtagEqualsCredentialEtag: true
      idempotency: same-rotate-request-replays-original-credential-and-sync-jobs
    fingerprint:
      ssh_key:
        input: RFC4253-public-key-blob-derived-from-the-private-key
        algorithm: SHA-256
        encoding: SHA256-colon-standard-base64-without-padding
      http_token:
        keyConfiguration: CREDENTIAL_FINGERPRINT_KEY
        keyRequirement: exactly-32-random-bytes-base64url-encoded-and-stable-across-master-key-rotation
        input: uint32be-username-byte-length-plus-utf8-username-plus-utf8-token
        algorithm: HMAC-SHA-256
        encoding: HMAC-SHA256-colon-base64url-without-padding
      sameFingerprintRotation: 422-validation_error
      loggingAndAudit: fingerprint-only-never-secret-or-hmac-key
  encryption:
    algorithm: AES-256-GCM
    activeMasterKeyConfiguration: MASTER_KEY
    activeMasterKeyVersionConfiguration: MASTER_KEY_VERSION
    previousMasterKeysFileConfiguration: MASTER_KEY_PREVIOUS_FILE
    keyEncoding: base64-of-exactly-32-bytes
    previousKeysFileFormat: json-object-mapping-positive-integer-version-strings-to-base64-keys
    derivation:
      algorithm: HKDF-SHA256
      salt: tenant-id-or-global-plus-credential-id-as-utf8
      info: meridian-credential-v1
      outputBytes: 32
    nonce: 12-cryptographically-random-bytes-per-encryption
    aad: canonical-utf8-of-scope-id-credential-id-kind-and-key-version
    storedFields: [ciphertext-with-authentication-tag, nonce, key_version]
    keyRotation:
      versionRule: MASTER_KEY_VERSION-must-be-greater-than-every-version-in-MASTER_KEY_PREVIOUS_FILE
      rewrite: decrypt-with-row-key-version-and-reencrypt-with-active-key
      removalGuard: old-key-cannot-be-removed-until-no-row-references-its-version

notificationChannels:
  secretLifecycle:
    createOrRotateOnly: true
    rotateOperation: rotateNotificationChannelSecret
    rotateRequires: [If-Match, Idempotency-Key]
    secretReadback: forbidden
    inAppSecretForbidden: true
    rotationAllowedKinds: [webhook]
    rotationOnOtherKind: invalid_state
  kindRules:
    in_app: {endpoint: forbidden, secret: forbidden}
    webhook: {endpoint: required-absolute-uri-https-outside-local-development, secret: required-on-create-minimum-32-characters}
    email: {endpoint: required-rfc5321-mailbox, secret: forbidden, transport: deployment-managed-smtp}

sse:
  jobLogs:
    endpoint: GET-/api/v1/t/{tenantSlug}/jobs/{jobId}/logs
    contentType: text/event-stream
    events: [log, state]
    replayCursor: persisted-job-stage-log-sequence-from-Last-Event-ID
    initialState: send-current-job-state-before-new-log-events
    ordering: sequence-ascending-with-state-snapshots-after-each-material-status-change
    heartbeatSeconds: 15
    terminalStatuses: [succeeded, succeeded_with_warnings, failed, outcome_unknown, cancelled]
    terminalBehavior: emit-final-state-then-close
    reconnect: client-reconnects-with-last-event-id; state-snapshot-makes-gaps-safe

authorization:
  permissionCatalog:
    platform:
      - platform:audit:read
      - platform:credential:manage
      - platform:job:read
      - platform:producer:manage
      - platform:settings:manage
      - platform:tenant:delete
      - platform:tenant:manage
      - platform:user:manage
    tenant:
      - asset:publish
      - asset:push
      - asset:read
      - assetkind:manage
      - credential:manage
      - credential:read
      - job:read
      - job:run
      - layer:approve
      - layer:edit
      - layer:read
      - repository:read
      - repository:sync
      - repository:write
      - service:create
      - service:manage_members
      - service:read
      - service:write
      - subscription:manage_self
      - systemgroup:manage
      - tenant:audit:read
      - tenant:member:manage
      - tenant:member:read
      - tenant:member:write
      - tenant:settings:manage
      - tenant:settings:read
      - tenant:settings:write
      - todo:read_self
      - token:manage
  platformRole:
    platform_admin:
      permissions: ['platform:*']
  resolution:
    - platform-scope-is-independent-from-tenant-scope
    - tenant-admin-grants-all-tenant-permissions
    - tenant-role-grants-are-unioned-with-service-grants
    - explicit-service-grants-may-add-permissions
    - no-grant-may-cross-a-tenant-boundary
  tenantRoles:
    tenant_admin:
      permissions: ['*']
    maintainer:
      permissions:
        - repository:read
        - repository:write
        - repository:sync
        - service:read
        - service:write
        - service:create
        - asset:read
        - asset:push
        - asset:publish
        - layer:read
        - layer:edit
        - job:read
        - job:run
        - subscription:manage_self
        - todo:read_self
        - token:manage
    viewer:
      permissions:
        - repository:read
        - service:read
        - asset:read
        - layer:read
        - subscription:manage_self
        - todo:read_self
        - token:manage
  serviceRoles:
    owner:
      permissions:
        - service:read
        - service:write
        - service:manage_members
        - asset:read
        - asset:publish
        - layer:read
        - layer:edit
        - layer:approve
    maintainer:
      permissions:
        - service:read
        - service:write
        - asset:read
        - asset:publish
        - layer:read
        - layer:edit
    viewer:
      permissions: [service:read, asset:read, layer:read]
  explicitServicePermissions:
    allowed: [layer:edit, layer:approve, asset:publish]
    storage: service_grants.permissions
  patScopes:
    asset:read: [service:read, asset:read, layer:read]
    asset:push: [asset:push]
    job:run: [repository:sync, job:run, job:read]
  unauthorizedResourceBehavior:
    authenticated: {httpStatus: 404, errorCode: not_found}
    unauthenticated: {httpStatus: 401, errorCode: unauthenticated}

visibility:
  private:
    anonymous: deny
    tenantMember: require-service-read-grant
  internal:
    anonymous: deny
    tenantMember: allow-read
  public:
    anonymous:
      serviceLifecycleAllowed: [published, deprecated]
      allow:
        - service-metadata
        - asset-metadata
        - current-published-version
        - single-document-public-views
      deny:
        - draft-or-non-current-versions
        - source-layers
        - provenance
        - downloads
        - search
        - mutations
    tenantMember: allow-read

enums:
  lifecycle: [draft, published, deprecated, retired]
  reviewStatus: [not_required, pending_review, approved, rejected, superseded]
  layerRole: [base, overlay]
  layerOrigin: [repo, third_party, manual, ai_generated]
  sourceMode: [builtin, command, push, manual, ai]
  sourceConfigOrigin: [db_manual, repo_file, repo_bootstrap]
  jobStatus: [pending, running, succeeded, succeeded_with_warnings, failed, outcome_unknown, cancelled]
  jobTrigger: [manual, schedule, webhook, api, cli, system, retry]
  pipelineStage: [resolve, discover, extract, merge, normalize, index]
  serviceVisibility: [private, internal, public]
  externalRevisionTrustMode: [review_required, trust_ai, trust_ai_and_third_party]
  domainEventType: [version.published, version.breaking, collect.failed, service.deprecated, ai_layer.generated, layer.approved, layer.rejected]
  subscriptionScopeType: [tenant, service, asset, system_group, asset_kind]

stateMachines:
  lifecycle:
    initial: draft
    transitions:
      draft: [published]
      published: [deprecated]
      deprecated: [retired]
      retired: []
  revisionReview:
    initialByOrigin:
      repo: not_required
      manual: not_required
      ai_generated: pending_review
      third_party: pending_review
    trustModeInitialStatus: approved
    transitions:
      pending_review: [approved, rejected, superseded]
      not_required: []
      approved: []
      rejected: []
      superseded: []
    supersedeActor: system-only
    immutableFields:
      - content_hash
      - content_ref
      - dialect
      - source_branch
      - git_commit
      - created_by
      - ai_meta
  job:
    transitions:
      pending: [running, cancelled]
      running: [succeeded, succeeded_with_warnings, failed, outcome_unknown, cancelled]
      succeeded: []
      succeeded_with_warnings: []
      failed: []
      outcome_unknown: []
      cancelled: []

serviceLifecycle:
  aggregate: service
  initial: draft
  transitionOperation: updateService
  sameStatePatch: idempotent-no-transition-event
  transitionRules:
    draftToPublished:
      publicEligibilityBeginsWhenVisibilityPublic: true
    publishedToDeprecated:
      appendOutboxEvent: service.deprecated
      eventCardinality: exactly-once-per-aggregate-version
    deprecatedToRetired:
      publicEligibilityEnds: true
      cancelPendingServiceWork: true
      runningWorkCommitFence: reject-new-revision-version-or-index-writes-after-retirement
  collectionEligibility: [draft, published, deprecated]
  retired:
    allowed:
      - authenticated-historical-read-subject-to-normal-authorization
      - service-soft-delete
      - self-service-notification-and-todo-actions
    rejectedWith409InvalidState:
      - repository-sync-materialization-for-this-service
      - source-create-update-delete-or-produce
      - layer-create-update-delete-reorder-review-or-rollback
      - asset-version-create-publish-deprecate-or-retire
      - service-metadata-or-access-update
    repositoryWideJobBehavior: skip-retired-services-and-continue-eligible-services
  publicReadGate:
    requiredVisibility: public
    allowedLifecycle: [published, deprecated]
    otherwise: 404-not_found
  persistence:
    serviceStateColumn: services.lifecycle
    serviceTransitionsNeverMutateAssetVersionLifecycle: true
  deletion:
    operation: deleteService
    response: 204-no-content
    slugAndRepositoryRootReuse: forbidden-while-soft-deleted-row-is-retained
    transaction:
      - lock-service-and-validate-if-match
      - set-service-deleted-at-and-increment-revision
      - set-source-specs-disabled-deleted-at-and-increment-revision
      - mark-source-bindings-stale-without-deleting-resolved-path-or-history
      - set-layers-disabled-deleted-at-and-increment-revision
      - set-assets-deleted-at-and-increment-revision
      - mark-asset-ref-tracks-inactive-and-increment-desired-generation
      - delete-service-grants-stars-recents-tags-and-system-group-memberships
      - soft-delete-service-comments
      - disable-subscriptions-targeting-the-service-or-its-assets
      - cancel-pending-service-and-asset-scoped-jobs
      - append-audit-row
    runningWorkCommitFence: service-deleted-at-must-still-be-null-before-any-revision-version-or-index-commit
    repositoryWideJobBehavior: skip-deleted-service-and-continue-other-services
