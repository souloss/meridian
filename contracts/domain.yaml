    externalReadAfterDelete: always-404-including-historical-version-and-public-routes
    physicalPurge: outside-v1-use-tenant-deletion-for-hard-removal

layerHeads:
  purpose: separate-latest-candidate-from-effective-content
  table: layer_heads
  key: [tenant_id, layer_id, scope_type, scope_key]
  scope:
    exact: {scopeType: ref, scopeKey: '<refType>:<refName>'}
    global: {scopeType: global, scopeKey: '*'}
  fields:
    latestRevisionId: newest-submitted-revision-in-that-scope
    effectiveRevisionId: newest-not-required-or-approved-revision-in-that-scope
    candidateRevisionId: current-pending-review-revision-or-null
    generation: monotonic-change-counter
  candidateLimit: 1
  candidateReplacement: mark-old-candidate-superseded
  revisionSubmission:
    sameAsEffective: unchanged
    sameAsCandidate: unchanged
    sameAsHistoricalOrRejected: create-new-revision-event-reusing-blob
    idempotencyKeyUnique: [layer_id, scope_type, scope_key, producer_run_id]
  selectionForMerge:
    - use-exact-branch-head-when-present
    - otherwise-use-global-head
  globalChangeFanout: all-active-tracks-that-inherit-the-global-head
  submission:
    notRequiredOrTrustedApproved: update-both-latest-and-effective
    pendingReview: update-latest-and-candidate-only
  approvalTransaction:
    - lock-layer-head
    - require-revision-is-current-candidate
    - set-review-status-approved
    - set-effective-to-approved-revision
    - clear-candidate
    - increment-generation
    - enqueue-merge
  rejectionTransaction:
    - lock-layer-head
    - require-revision-is-current-candidate
    - set-review-status-rejected
    - clear-candidate
    - keep-effective-unchanged
  rollback:
    allowedReviewStatuses: [not_required, approved]
    effect: move-effective-only-and-enqueue-merge
  deletion:
    softDeleteLayer: true
    setDeletedAtOnLayer: true
    revisionReviewStatusIsNeverChangedForArchival: true

assetRefTracks:
  table: asset_ref_tracks
  key: [tenant_id, asset_id, ref_type, ref_name]
  refTypes: [branch, tag]
  fields:
    latestVersionId: nullable
    currentVersionId: nullable
    health: [ok, stale, invalid]
    desiredGeneration: integer
    processedGeneration: integer
    active: boolean
  defaultBranch: repository.default_branch
  repoAndCommandRevisionScope: exact-branch
  manualAndPushRevisionDefaultScope: '*'
  aiRevisionScope: requested-branch
  assetDetailRefQueryDefault: repository.default_branch
  deletedGitRefBehavior: preserve-track-history-and-mark-inactive
  assetResponseProjection:
    lifecycle: current-version-lifecycle-else-latest-version-lifecycle-else-draft
    qualityScore: latest-version-quality-score-else-null
    persistence: never-store-asset-level-lifecycle-or-quality
  versionUniqueness:
    label: [track_id, version]
    sequence: [track_id, sequence_no]
    jobRetry: [merge_request_id]
  refLatestResolution: asset_ref_tracks.latest_version_id
  refCurrentResolution: asset_ref_tracks.current_version_id

versions:
  creationRequiresEffectiveBase: true
  emptySkeletonUseOnly: [ai-input, merge-preview]
  emptySkeletonMustNotCreateVersion: true
  immutableAfterCreationExcept: [version-label-before-first-publish, lifecycle-status]
  initialVersion: 1.0.0
  sequenceScope: asset-ref-track
  comparisonBase:
    trackHasPreviousVersion: previous-latest-version-in-same-track
    firstVersionOnDefaultBranch: none
    firstVersionOnNonDefaultBranch: default-branch-current-else-latest-at-sync-start
    persistenceField: baseline_version_id
  automaticIncrement:
    breaking: major
    nonBreakingAddition: minor
    allOtherInputChanges: patch
  noNewVersionWhen:
    - build-fingerprint-equals-current-latest-version-build-fingerprint
  buildFingerprintFields:
    - ordered-layer-revision-manifest
    - merge-engine-version
    - overlay-dialect-compiler-version
    - normalizer-version
    - kind-plugin-version
    - overlay-target-miss-mode
  historicalHashReuse: create-new-version
  manualVersion:
    allowedOnlyOnFirstPublish: true
    mustBeGreaterThanEveryExistingTrackVersion: true
  latestDefinition: newest-created-version-in-track
  currentDefinition: selected-published-version-in-track
  publish:
    concurrency:
      requestHeader: If-Match
      token: asset_versions.revision-as-opaque-etag
      staleOrMissing: 412-precondition_failed
      success: increment-version-revision-and-return-body-and-header-etag
    preconditions:
      - version-status-is-draft-or-already-published
      - every-manifest-revision-is-not-required-or-approved
      - no-enabled-applicable-layer-head-has-a-candidate-revision
      - requested-version-label-is-unique-in-selected-track
    idempotentWhenAlreadyPublished: true
    previousPublishedVersionsRemainPublished: true
    effect: move-current-track-head-to-this-version
  autoPublish:
    setting: tenant.autoPublish
    default: false
    eligibleOnlyWhen:
      - new-version-index-complete
      - effective-manifest-has-no-pending-review
      - base-origin-is-repo
      - no-ai-generated-effective-layer
      - no-enabled-applicable-candidate
    effect: invoke-publish-preconditions-in-same-application-transaction
  deprecate:
    concurrency: same-as-publish
    effect: fallback-current-to-most-recent-still-published-version
  retire:
    concurrency: same-as-publish
    effect: fallback-current-to-most-recent-still-published-version
  automaticDiff:
    left: persisted-baseline-version-id
    right: newly-created-version
    todoCreatedWhen: summary.breaking-greater-than-zero

merge:
  engineVersion: 1
  baseSkeletons:
    openapi:
      openapi: 3.1.0
      info: {title: Untitled API, version: 0.0.0}
      paths: {}
  overlayOrder:
    primary: ord-ascending
    tieBehavior: reject-duplicate-order
  targetMissDefault: lenient
  targetMissModes: [lenient, strict]
  jsonPathSubset:
    child: true
    recursiveDescent: false
    arrayIndex: true
    wildcard: true
    equalityFilter: true
    scriptExpression: false
    wildcardWriteOrder: document-order
    arrayDeletionOrder: reverse-document-order
  canonicalization: RFC8785-JCS
  provenance:
    key: json-pointer
    value: last-writing-layer-and-revision
    baseOwnsUnmodifiedPointers: true
  manifestSelection: effective-revisions-only

sourceCompatibility:
  allowed:
    - {role: base, origin: repo, mode: builtin, approval: not_required}
    - {role: base, origin: repo, mode: command, approval: not_required}
    - {role: base, origin: third_party, mode: push, approval: review}
    - {role: base, origin: manual, mode: manual, approval: not_required}
    - {role: base, origin: ai_generated, mode: ai, approval: review}
    - {role: overlay, origin: repo, mode: builtin, approval: not_required}
    - {role: overlay, origin: repo, mode: command, approval: not_required}
    - {role: overlay, origin: third_party, mode: push, approval: review}
    - {role: overlay, origin: manual, mode: manual, approval: not_required}
    - {role: overlay, origin: ai_generated, mode: ai, approval: review}
  modeFields:
    builtin:
      fixed: {origin: repo}
      required: [path]
      forbidden: [producerProfileId]
    command:
      fixed: {origin: repo}
      required: [producerProfileId]
      forbidden: [path]
    push:
      fixed: {origin: third_party}
      required: []
      forbidden: [path, producerProfileId]
    manual:
      fixed: {origin: manual}
      required: []
      forbidden: [path, producerProfileId]
      apiCreateRequires: [targetAssetId]
      repositoryConfigRequires: asset-entry-identity
    ai:
      fixed: {origin: ai_generated}
      required: [producerProfileId]
      forbidden: [path]
  roleFields:
    base: {ord: 0}
    overlay: {ordMinimum: 0, ordUniqueWithinAsset: true}
  createDefaults:
    assetNameTemplate: '{file_stem}'
    ord: 0
    timeoutSecByMode: {builtin: 120, command: 120, push: 120, manual: 120, ai: 600}
    branchPatterns: ['**']
    enabled: true
  patchValidation: validate-the-complete-merged-source-spec-not-the-partial-patch-document
  producerTimeout:
    effectiveSeconds: minimum-of-source-spec-timeout-and-producer-profile-timeout
