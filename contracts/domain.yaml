    assetHasEffectiveBase: overlay
    assetHasNoEffectiveBase: base
  trustSetting:
    review_required: [ai_generated-pending, third_party-pending]
    trust_ai: [ai_generated-approved, third_party-pending]
    trust_ai_and_third_party: [ai_generated-approved, third_party-approved]
  pushIdentity:
    stableSourceKey: [tenantId, serviceSlug, kind, assetName, sourceSystem]
    operationReplayKey: [principalId, operationId, idempotencyKey]
    createIfMissingDefault: false
    roleDefault: base
  baseReplacement:
    implicitReplacement: forbidden
    allowedReplacement: repo-base-replaces-existing-ai-generated-base
    requestFlag: replaceAiBase
    configImportFlag: replaceAiBases
    transaction:
      - lock-asset-and-existing-base
      - require-new-origin-repo-and-role-base
      - require-old-origin-ai_generated-and-role-base
      - soft-delete-old-source-and-layer-with-history-retained
      - create-repository-base-source-and-layer
      - increment-all-affected-track-generations
    failureWithoutFlag: base_layer_exists

  sourceExpansion:
  configuredEntity: source_specs
  materializedEntity: source_bindings
  relation: one-source-spec-to-many-source-bindings
  sourceSpecFields:
    - service_id
