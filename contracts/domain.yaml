      maximumTtlSeconds: 300
      shareLinkRule: shareLinkId-is-required-for-share-content-and-must-still-be-active
      responseHeaders: [Content-Type, Content-Disposition, X-Content-Type-Options]
    s3CompatibleDriver: outside-v1-scope
  blobAccounting: unique-bytes-per-tenant
  workspaceAccounting: included-in-storage-quota
  referencedRevisionRetention: forever-until-tenant-deletion
  unreferencedArchivedRevisionRetention: tenant-setting
  oldAssetVersionRetention: forever-until-tenant-deletion
  softDeleteRestoreWindowDays: 30
  tenantDeletion:
    confirmation: tenant-slug-and-recent-authentication
    asynchronous: true
    requestTransaction:
      - lock-tenant-and-verify-if-match
      - require-confirmed-slug-and-recent-authentication
      - set-tenant-status-disabled-and-increment-revision
      - enqueue-tenant-deletion-job
      - return-job-id-and-post-update-etag
    businessAccessAfterAcceptance: not_found
    job:
      - delete-tenant-business-rows-and-tenant-blob-references
      - physically-delete-only-blobs-with-zero-remaining-tenant-references
      - retain-redacted-tenant-tombstone-and-metadata-only-audit-rows
    auditMetadataRetainedDays: 365
    auditContentRestriction: identifiers-actions-timestamps-and-hashes-only-no-business-content-or-secrets
    tombstoneSlugReuse: forbidden-until-audit-retention-expires
    finalizationAfterRetention: delete-retained-audit-rows-then-tenant-tombstone
    businessDataAndUnsharedBlobsDeleted: true

defaults:
  tenant:
    externalRevisionTrustMode: review_required
    autoPublish: false
    defaultLocale: zh-CN
    defaultAiProducerProfileId: null
    maxRepositories: 50
    maxServices: 200
    maxStorageBytes: 10737418240
    maxCollectConcurrency: 4
    retentionDays:
      jobLogs: 30
      archivedRevisions: 90
  repository:
    defaultBranch: main
    branchPolicy:
      omittedCreateBehavior:
        branchPatterns: [submitted-defaultBranch-exact-match]
        tagPatterns: []
    shallow: true
    depth: 50
    submodules: false
    configSyncPolicy: ignore
  source:
    timeoutSecondsByMode: {builtin: 120, command: 120, push: 120, manual: 120, ai: 600}
    branchPatterns: ['**']
    overlayMode: lenient
  qualityScore:
    algorithm: weighted-deductions-v1
    base: 100
    deductions:
      error: 20
      warning: 5
      info: 0
    floor: 0
    ceiling: 100
