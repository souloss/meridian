    merge_engine_version: text
    overlay_compiler_version: text
    overlay_mode: text
    normalizer_version: text
    kind_plugin_version: text
    merged_ref: text
    normalized_ref: text
    bundled_ref: text
    provenance_ref: text
    source_commit: text
    item_type: text
