schemaVersion: 1
contractId: meridian-postgresql-storage-v1
status: frozen
database:
  engine: PostgreSQL
  minimumVersion: 16
  extensions: [pg_trgm, btree_gin]
  migrationTool: goose-v3-embedded-sql
  migrationPolicy:
    startup: auto-up-before-http-readiness-and-worker-start
    failure: abort-process-and-keep-readiness-false
    lock: one-session-level-postgresql-advisory-lock-for-river-and-application-migrations
    order: [river-to-pinned-target-version, application-schema]
    applicationTransaction: one-transaction-per-migration-by-default
    nonTransactionalMigration: requires-explicit-no-transaction-annotation-and-decision-record
    startupDown: forbidden
    operatorDown: explicit-migrate-command-with-step-count
    riverTarget: exact-version-recorded-with-application-release
  identifiers: uuid-v7
  timestamps:
    type: timestamptz
    timezone: UTC
    declarationRule: only-columns-listed-in-each-table-fields-exist
  tenantRule: >-
    Every tenant-owned primary or unique key includes tenant_id either directly
    or through a database-enforced composite foreign key, except an explicitly
    declared globalUnique key used for token lookup. Repository methods require
    tenant_id as their first argument.
  globalUniqueExceptions: [api_tokens.token_hash, share_links.token_hash]

ddlConventions:
  fieldCoverage: every-field-must-resolve-exactly-one-sql-type
  enumStorage: text-with-check-generated-from-domain.yaml
  unknownFieldBehavior: fail-contract-validation
  sqlTypeResolutionOrder: [tableColumnOverrides, exactColumnTypes, suffixTypes]
  fallback: forbidden
  tableColumnOverrides:
    platform_settings.id: text
    asset_kinds.id: text
    tenant_kind_overrides.kind_id: text
    source_specs.kind: text
    assets.kind: text
    asset_items.kind: text
    view_overrides.view_id: text
    idempotency_records.operation_id: text
    idempotency_records.response_status: integer
    global_idempotency_records.operation_id: text
    global_idempotency_records.response_status: integer
    known_hosts.port: integer
    producer_profiles.supported_kinds: 'text[]'
    producer_profiles.args: 'jsonb'
    producer_profiles.env_allowlist: 'text[]'
    source_specs.branch_patterns: 'text[]'
    layers.branch_patterns: 'text[]'
    api_tokens.scopes: 'text[]'
    service_grants.permissions: 'text[]'
    subscriptions.events: 'text[]'
    subscriptions.target_id: text
    diff_rule_sets.version: integer
  exactColumnTypes:
    id: uuid
    tenant_id: uuid
    parent_id: uuid
    user_id: uuid
    team_id: uuid
    credential_id: uuid
    global_credential_id: uuid
    repository_id: uuid
    service_id: uuid
    tag_id: uuid
    source_spec_id: uuid
    asset_id: uuid
    layer_id: uuid
    revision_id: uuid
    latest_revision_id: uuid
    effective_revision_id: uuid
    candidate_revision_id: uuid
    producer_profile_id: uuid
    producer_run_id: uuid
    track_id: uuid
    latest_version_id: uuid
    current_version_id: uuid
    asset_version_id: uuid
    baseline_version_id: uuid
    retry_of_job_id: uuid
    merge_request_id: uuid
    rule_set_id: uuid
    group_id: uuid
    channel_id: uuid
    subscription_id: uuid
    event_id: uuid
    creator_id: uuid
    created_by: uuid
    author_id: uuid
    requested_by: uuid
    assignee_id: uuid
    actor_id: uuid
    target_id: uuid
    principal_id: uuid
